name: CI Pipeline

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]

jobs:
  build_and_test:
    runs-on: ubuntu-latest

    # MySQLサービスコンテナの起動
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: internalbooks
          MYSQL_USER: admin
          MYSQL_PASSWORD: password
        ports:
          - 13306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    # Run the job within the InternalBooks module directory where build.gradle exists
    defaults:
      run:
        working-directory: ./InternalBooks

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Step 1 - Compile
        run: ./gradlew compileJava --no-daemon

      - name: Step 2 - Unit Tests
        run: ./gradlew test --no-daemon

      - name: Step 3 - Build JAR
        run: ./gradlew bootJar --no-daemon
