name: CI Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build_and_test:
    runs-on: ubuntu-latest

    # Run the job within the InternalBooks module directory where build.gradle exists
    defaults:
      run:
        working-directory: ./InternalBooks

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Step 1 - Compile
        run: ./gradlew compileJava --no-daemon

      - name: Step 2 - Unit Tests
        run: ./gradlew test --no-daemon

      - name: Step 3 - Build JAR
        run: ./gradlew bootJar --no-daemon
