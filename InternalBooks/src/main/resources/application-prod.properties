# ========== 本番環境用設定 START ==========

# サーバ設定（HTTPS）
server.port=${SERVER_PORT:8080}

# SSL設定（Let's Encrypt + PKCS12）
server.ssl.enabled=${SSL_ENABLED:true}
server.ssl.key-store=${SSL_KEYSTORE_PATH:/opt/ssl/keystore.p12}
server.ssl.key-store-password=${SSL_KEYSTORE_PASSWORD}
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=tomcat

# HTTP->HTTPS リダイレクト用ポート（オプション）
server.http.port=${HTTP_PORT:80}

# ログレベル
logging.level.root=INFO
logging.level.org.springframework.web=INFO

# データソース設定（コンテナ内 MySQL を利用、.env.prod から環境変数で注入）
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://${DB_HOST:mysql}:${DB_PORT:3306}/${DB_NAME:internalbooks}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Tokyo
spring.datasource.username=${DB_USER:internalbooks}
spring.datasource.password=${DB_PASSWORD:change_me_app}

# HikariCP 接続プール最適化（2GB EC2向け）
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# JWT シークレット（環境変数 JWT_SECRET から注入、本番では必ず強固な値を設定すること）
jwt.secret=${JWT_SECRET:change-me-in-production}

# 画像ストレージタイプ: s3
app.image.storage.type=s3

# AWS S3設定
# バケット名（環境変数または実際のバケット名に置き換えてください）
app.image.storage.s3.bucket-name=${AWS_S3_BUCKET_NAME:your-bucket-name}
# 画像のプレフィックスパス（オプション、例: "images/"）
app.image.storage.s3.prefix=images/
# AWSリージョン（オプション、デフォルトはus-east-1）
app.image.storage.s3.region=${AWS_REGION:ap-northeast-1}

# CloudFront CDN設定（S3画像のHTTPS配信用）
app.image.cdn.enabled=${CLOUDFRONT_ENABLED:false}
app.image.cdn.base-url=${CLOUDFRONT_URL:}

# Actuator ヘルスチェック（ALB/コンテナの健全性判定用）
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# ========== 本番環境用設定 END ==========

