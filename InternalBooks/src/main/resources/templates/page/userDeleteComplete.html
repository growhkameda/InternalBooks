<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/layout :: layout(~{::title}, ~{::section})}">

<head>
	<title>userDeleteComplete</title>
</head>

<body>
	<section class="container justify-content-center mt-5">

		<h1 class="text-center">図書館システム</h1>
		<br>
		<h2 class="text-center mt-4">ユーザー削除完了</h2>
		<br>

		<div class="h-25 border bg-body-secondary d-flex align-items-center">
			<p class="mt-1 ms-3 fw-normal h6">
				ユーザー削除が完了しました。
			</p>
		</div>
		<!-- 社員ID -->
		<div class="container mt-4">
			<div class="row justify-content-center">
				<div class="col-11 col-sm-8 pt-2">
					<p class="form-label text-start">社員ID</p>
					<div class="rounded-2 h-75 border border-black">
						<p class="mt-3 ms-2 fw-normal  text-break" th:text="${users.userId}"></p>
					</div>
				</div>
			</div>
		</div>

		<!-- 名前 -->
		<div class="container mt-4">
			<div class="row justify-content-center">
				<div class="col-11 col-sm-8 pt-2">
					<p class="form-label text-start">名前</p>
					<div class="rounded-2 h-75 border border-black">
						<p class="mt-3 ms-2 fw-normal  text-break" th:text="${users.name}"></p>
					</div>
				</div>
			</div>
		</div>

		<!-- 所属課 -->
		<div class="container mt-4">
			<div class="row justify-content-center">
				<div class="col-11 col-sm-8 pt-2">
					<p class="form-label text-start">所属課</p>
					<div class="rounded-2 h-75 border border-black">
						<p class="mt-3 ms-2 fw-normal" th:text="${userdepart.departmentName}"></p>
					</div>
				</div>
			</div>
		</div>

		<!-- ================== 戻るボタン ================== -->
		<div class="row d-flex justify-content-center mt-4 mb-4 text-start">
			<a href="/admin/adminusertop" class="col-11 col-sm-8 text-black ms-1">
				<img src="/images/TOP_Return.png" style="width: 40px; height: 40px;">
			</a>
		</div>
	</section>
</body>

</html>
