<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/layout :: layout(~{::title}, ~{::section})}">

<head>
  <title>貸出中書籍</title>
</head>

<body>
  <section th:fragment="section">

    <!-- ================== ページメインタイトル ================== -->
    <div class="container text-center" style="max-width: 400px; margin-top: 50px;">
      <h1 class="fw-bold mt-4" style="font-size: 50px; margin-bottom: 5rem;">貸出中書籍</h1>
      <p class="text-muted mt-5 mb-3" style="font-size: 16px;">書籍をタップするとカード詳細画面に遷移します</p>
    </div>

    <!-- ================== 貸出中書籍なしの場合の表示 ================== -->
    <div th:if="${checkedOutBooks == null or #lists.isEmpty(checkedOutBooks)}" 
         class="text-center text-muted" style="margin-top: 100px;">
      <!-- 本のアイコン表示 -->
      <i class="bi bi-book" style="font-size: 4em; color: #ccc;"></i>
      <!-- メッセージ表示 -->
      <p class="fs-5 mt-4">現在貸出中の書籍はありません</p>
      <!-- トップページへの戻りボタン -->
      <div class="col-12 border-0 mt-4">
        <a href="/page/top" class="text-black ms-2">
            TOPに戻る
            <i class="bi bi-arrow-return-left ms-1"></i>
        </a>
      </div>
    </div>

    <!-- ================== 貸出中書籍ありの場合の表示 ================== -->
    <div th:if="${checkedOutBooks != null and not #lists.isEmpty(checkedOutBooks)}" 
         class="container" style="max-width: 400px;">
      
      <!-- ========== 書籍一覧表示エリア（縦並び） ========== -->
      <div th:each="book : ${checkedOutBooks}" class="text-center mb-4">
        <!-- 書籍カード（検索結果詳細ページにリンク） -->
        <a th:href="@{/page/searchresult(bookId=${book.bookId})}" 
           class="btn btn-light w-100 p-0 border-0 shadow-sm rounded-4 text-start text-decoration-none">
          <div class="card border-0 rounded-4 overflow-hidden bg-transparent">
            <!-- 書籍画像エリア -->
            <div class="text-center p-4">
              <img th:src="@{${book.imageUrl}}" 
                   class="img-fluid rounded shadow" 
                   style="width: 200px; height: 280px; object-fit: cover;" 
                   alt="書籍画像"
                   onerror="handleImageError(this)" />
            </div>
            
            <!-- 書籍情報エリア -->
            <div class="card-body p-4 text-center" style="padding-top: 1rem !important;">
              <!-- 書籍名 -->
              <h5 class="card-title fw-bold mb-2 text-dark" th:text="${book.title}">書籍名</h5>
              
              <!-- カテゴリー -->
              <div class="mb-2">
                <span class="badge bg-primary rounded-pill px-3 py-2" 
                      style="font-size: 14px;" 
                      th:text="${book.category}">カテゴリー</span>
              </div>
              
              <!-- 貸出状況 -->
              <p class="text-muted mb-0" th:text="${book.status} + ' or 書籍所'">貸出中 or 書籍所</p>
            </div>
          </div>
        </a>
      </div>

      <!-- ========== トップページへ戻るリンク ========== -->
      <div class="border-0 mt-4 mb-5 text-start">
        <a href="/page/top" class="text-black ms-1">
             TOPに戻る
             <i class="bi bi-arrow-return-left ms-1"></i>
        </a>
     </div>
    </div>

  </section>

  <!-- 画像エラー処理用JavaScript -->
  <script>
    function handleImageError(img) {
      // 無限ループを防ぐため、既にエラー処理済みの場合は何もしない
      if (img.dataset.errorHandled === 'true') {
        return;
      }
      
      // エラー処理済みフラグを設定
      img.dataset.errorHandled = 'true';
      
      // 画像の代わりにBootstrapアイコンを表示するため、親要素を変更
      const parent = img.parentElement;
      parent.innerHTML = `
        <div class="d-flex align-items-center justify-content-center h-100 text-muted" 
             style="width: 200px; height: 280px;">
          <i class="bi bi-book" style="font-size: 4rem;"></i>
        </div>
      `;
    }
  </script>
</body>
</html>
