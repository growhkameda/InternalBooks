<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/layout :: layout(~{::title}, ~{::section})}">

<head>
    <title>ユーザー登録確認</title>
</head>

<body>
<section class = "container justify-content-center mt-5">

    <h1 class= "text-center">GrowLibrary</h1>
    <br>
    <h3 class= "text-center mt-4">ユーザー登録確認</h3>
    <br>

<!-- 社員ID -->
<div class ="container mt-4">
  <div class = "row justify-content-center">
	  <div class = "col-11 col-sm-8 pt-2">
	      	<label for = "id" class="form-label text-start">社員ID</label>
	      	<p th:text="${userDto.userId}" class="form-control bg-white border-dark text-break">
	  </div>
  </div>
</div>

<!-- メールアドレス -->
<div class ="container mt-3">
  <div class = "row justify-content-center">
	  <div class = "col-11 col-sm-8 pt-2">
	      	<label for = "mail" class="form-label text-start">メールアドレス</label>
	      	<p th:text="${userDto.mailAddress}" class="form-control bg-white border-dark text-break" style="word-wrap: break-word; white-space: normal;">
	  </div>
  </div>
</div>

<!-- 名前 -->
<div class ="container mt-3">
  <div class = "row justify-content-center">
	  <div class = "col-11 col-sm-8 pt-2">
	      	<label for = "name" class="form-label text-start">名前</label>
	      	<p th:text="${userDto.name}" class="form-control bg-white border-dark text-break">
	  </div>
  </div>
</div>

<!-- 所属課  -->
<div class ="container mt-3">
  <div class = "row justify-content-center">
	  <div class = "col-11 col-sm-8 pt-2">
	      	<label for = "department" class="form-label text-start">所属課</label>
	      	<p th:text="${userDto.departmentId}" class="form-control bg-white border-dark text-break">
	  </div>
  </div>
</div>

<form th:action="@{/admin/back}" method="post" th:object="${userDto}" enctype="application/x-www-form-urlencoded">
	<!--hiddenで値を保持-->
    <input type="hidden" th:field="*{userId}">
    <input type="hidden" th:field="*{mailAddress}">
    <input type="hidden" th:field="*{name}">
    <input type="hidden" th:field="*{departmentId}">

    <div class="text-start mt-3 mb-1 d-flex justify-content-center text-start">
        <button type="submit" class="col-11 col-sm-8 ms-1 text-start" style="border: none; background: none;">
            <img src="/images/SOME_Return.png" style="width: 40px; height: 40px;">
        </button>
    </div>
</form>


<!-- 登録 -->
<form th:action="@{/admin/userregistrationcomplete}" method="post" th:object= "${userDto}" enctype="application/x-www-form-urlencoded">	
<div class ="container text-center mt-4">
	  <div class = "col-auto">
	      <button type="submit" class="col-5 col-sm-2 btn shadow col-2" style="color: #47B78A">登録</button>

	      <!-- hiddenで値を保持 -->
          <input type="hidden" th:field="*{userId}">
          <input type="hidden" th:field="*{mailAddress}">
          <input type="hidden" th:field="*{name}">
          <input type="hidden" th:field="*{departmentId}">

	  </div>
</div>
</form>
</section>
</body>
