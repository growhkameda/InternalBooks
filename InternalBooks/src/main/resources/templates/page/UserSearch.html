<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/layout :: layout(~{::title}, ~{::section})}">

<head>
  <title>ユーザー検索</title>
</head>

<body>
  <section class="d-flex justify-content-center align-items-start py-5">
    <div class="container d-flex justify-content-center align-items-start">
      <div class="w-100" style="max-width: 350px;">

        <!-- ================== ページメインタイトル ================== -->
        <h1 class="fw-bold mt-5 display-3 mb-5 text-center">ユーザー検索</h1>

        <!-- ================== 検索窓と検索ボタン ================== -->
        <div class="mb-3 d-flex flex-column align-items-center">
            <input type="text" 
                class="text-center form-control bg-secondary-subtle shadow-sm"
                style="width: 80%;"
                id="search"
                name="search"
                placeholder="所属課または名前を入力">
            <button type="button" class="btn btn-warning shadow-sm fs-6 w-25 mt-3" id="searchButton">検索</button>
        </div>

        <!-- ================== 戻るボタン ================== -->
        <div class="border-0 mb-5 text-start">
            <a href="/admin/adminusertop" class="text-black ms-1">
                管理者TOPへ戻る
                <i class="bi bi-arrow-return-left ms-1"></i>
            </a>
        </div>

        <!-- ================== ユーザー一覧テーブル ================== -->
        <div class="mt-5">
          <div class="table-responsive">
            <table class="table table-sm table-borderless w-100">
              <thead class="table-primary">
                <tr>
                  <th class="text-center col-6 border-end border-2 border-white">所属課</th>
                  <th class="text-center col-6 border-end border-2 border-white">名前</th>
                </tr>
              </thead>

                <!-- ユーザーデータの表示 -->
              <tbody id="userTableBody">
                <tr th:each="user : ${users}" th:if="${users != null and !#lists.isEmpty(users)}" 
                    class="user-row">
                  <td colspan="2" class="text-center p-0">
                    <a th:href="@{/admin/userconfirmation(userId=${user.userId})}"
                        class="btn btn-light w-100 p-0 border-0 rounded-0 shadow-sm text-start mb-2">
                      <div class="card border-0 rounded-0 overflow-hidden bg-transparent">
                        <div class="card-body p-3 text-center">
                          <div class="row">
                            
                            <!--データ表示領域-->
                            <div class="col-6">
                              <span class="fw-bold text-dark department-name" th:text="${user.departmentName}">所属課</span>
                            </div>
                            <div class="col-6">
                              <span class="fw-bold text-dark user-name" th:text="${user.name}">名前</span>
                            </div>
                            
                          </div>
                        </div>
                      </div>
                    </a>
                  </td>
                </tr>
                <!-- ユーザーがない場合 -->
                <tr th:if="${users == null or #lists.isEmpty(users)}">
                  <td colspan="2" class="text-center text-muted">ユーザーが存在しません</td>
                </tr>
              </tbody>

            </table>
          </div>
        </div>
      </div>
    </div>
  </section>
</body>
