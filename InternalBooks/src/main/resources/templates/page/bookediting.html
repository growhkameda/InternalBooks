<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/layout :: layout(~{::title}, ~{::section})}">

<head>
    <title>書籍編集登録画面</title>
</head>

<body>
<section class = "container justify-content-center mt-5">

<!-- Tom Select CSS -->
<link href="https://cdn.jsdelivr.net/npm/tom-select@2.3.1/dist/css/tom-select.bootstrap5.min.css" rel="stylesheet">

    <h1 class= "text-center">書籍登録編集画面</h1>
    <br>

<form th:action="@{/admin/bookingconfirmation}" method="post" th:object= "${bookdto}" enctype="multipart/form-data">
       
<!-- 書籍名 -->
<div class ="container text-center mt-4">
  <div class = "row justify-content-center gap">
	  <div class = "col-auto pt-2 ms-4">
	      	<label for = "name">書籍名</label>
	  </div>
	  <div class = "col-7 col-md-8 ms-2" >
		  <!-- バリデーションエラーを表示 -->
	      	<span th:errors="*{title}" class="text-danger"></span>
			<input type ="text" th:field="*{title}" class="form-control bg-light">
	  </div>
  </div>
</div>

<!-- カテゴリー -->
<div class ="container text-center mt-4">
  <div class = "row justify-content-center">
	  <div class = "col-auto pt-2">
	      	<label for = "category">カテゴリー</label>
	  </div>
	  <div class = "col-7 col-md-8">
		  <!-- バリデーションエラーを表示 -->
	      	<span th:errors="*{category}" class="text-danger"></span>
			<select id="categorySelect" th:field="*{category}" class="form-select bg-light">
				<option value="">-- カテゴリーを選択または入力 --</option>
				<option th:each="cat : ${existingCategories}"
				        th:value="${cat}"
				        th:text="${cat}">
				</option>
			</select>
	  </div>
  </div>
</div>

<!-- 書籍提供者 -->
<div class ="container text-center mt-4">
  <div class ="row justify-content-center">
	  <div class = "col-auto pt-2">
			<label for = "id">書籍提供者</label>
	  </div>
	  <div class = "col-7 col-md-8">
		  <!-- バリデーションエラーを表示 -->
	      	<span th:errors="*{providerId}" class="text-danger"></span>
			<select id="providerIdSelect" th:field="*{providerId}" class="form-select bg-light">
				<option value="">-- 選択してください --</option>
				<option th:each="user : ${activeUsers}"
				        th:value="${user.name}"
				        th:text="${user.name}">
				</option>
			</select>
	  </div>
  </div>
</div>

<!-- 書籍提供者コメント -->
<div class ="container text-center mt-4">
  <div class ="row justify-content-center">
	  <div class = "col-auto pull-left pt-2">
			<label for = "id">書籍提供者</label>
			<br>
			<label for = "id">コメント</label>
	  </div>
	  <div class = "col-7 col-md-8">
		  <!-- バリデーションエラーを表示 -->
	      	<span th:errors="*{providerComment}" class="text-danger"></span>
			<textarea class="form-control bg-light" style="height:150px;" th:field="*{providerComment}"></textarea>
	  </div>
  </div>
</div>

<!-- 書籍画像 -->
<div class ="container text-center mt-4">
  <div class ="row justify-content-center">
	  <div class = "col-auto mt-1 pt-2 ms-3">
			<label for = "id">書籍画像</label>
	  </div>	   
	     <div class = "col-7 col-md-8">
		　 　<!-- バリデーションエラーを表示 -->
		    <span th:errors="*{imageFile}" class="text-danger me-5"></span>
		    <!-- 外枠（中央寄せ） -->
			<div class="border rounded bg-light d-flex justify-content-center align-items-center" style="height: 150px;">
            <!-- 中央基準の横並び -->
            <div class="d-flex align-items-center">
            <!-- ファイル選択 -->
           <div class="text-center">
            <span class="d-block mb-1">ファイルを選択</span>
            <input type="file"
                     id="imageInput"
               th:field="*{imageFile}"
                  class="d-none" 
                  accept="image/*"
                onchange="document.getElementById('preview').src = window.URL.createObjectURL(this.files[0]);
                          document.getElementById('preview').style.display='block';">
                          
            <label for = "imageInput" class="btn">
			<i class="bi bi-copy icon-hover"></i>
		    </label>	
		    
           </div>
            <!--プレビュー -->
           <div class="ms-4">
            <img id="preview"
                 style="max-width:120px; max-height:120px; display:none;"
                 class="mb-2">           
           </div>			
          </div>	 
        </div>
	     </div>
    </div>
 </div>
 
<!-- 戻る -->
<div class="container mt-5">
  <div class="row">
    <div class="col-12 text-start ms-lg-5">
      <a href="/admin/adminusertop" class="btn fs-6">
        戻る
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor"
             class="bi bi-arrow-return-left ms-1 mb-1" viewBox="0 0 16 16">
          <path fill-rule="evenodd"
                d="M14.5 1.5a.5.5 0 0 1 .5.5v4.8a2.5 2.5 0 0 1-2.5 2.5H2.707l3.347 3.346a.5.5 0 0 1-.708.708l-4.2-4.2a.5.5 0 0 1 0-.708l4-4a.5.5 0 1 1 .708.708L2.707 8.3H12.5A1.5 1.5 0 0 0 14 6.8V2a.5.5 0 0 1 .5-.5" />
        </svg>
       </a>
    </div>
  </div>
</div>

<!-- 登録確認 -->
<div class ="container text-center mt-4">
   <div class = "col-auto">
	 <button type="submit" class="btn btn-primary">登録確認</button>
   </div>
</div>
</form>

<!-- Tom Select JS -->
<script src="https://cdn.jsdelivr.net/npm/tom-select@2.3.1/dist/js/tom-select.complete.min.js"></script>
<script>
    document.addEventListener("DOMContentLoaded", function () {
        // 書籍提供者：検索のみ（既存ユーザーから選択）
        new TomSelect('#providerIdSelect', {
            create: false,
            placeholder: '名前で検索...',
            sortField: { field: 'text', direction: 'asc' },
            plugins: ['dropdown_input']
        });

        // カテゴリー：既存から検索 + 新規入力も可能
        new TomSelect('#categorySelect', {
            create: true,
            placeholder: 'カテゴリーを検索または新規入力...',
            sortField: { field: 'text', direction: 'asc' },
            plugins: ['dropdown_input'],
            createFilter: function (input) {
                return input.trim().length > 0;
            },
            render: {
                option_create: function (data, escape) {
                    return '<div class="create">「<strong>' + escape(data.input) + '</strong>」を新規追加</div>';
                }
            }
        });
    });
</script>
</section>
</body>
</html>
