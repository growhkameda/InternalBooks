<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/layout :: layout(~{::title}, ~{::section})}">

<head>
	<title>ユーザー編集完了</title>
</head>

<body>
	<section class="container justify-content-center mt-5">

		<h1 class="text-center">図書館システム</h1>
		<br>
		<h2 class="text-center mt-4">ユーザー編集完了</h2>
		<br>

		<div class="h-25 border bg-body-secondary d-flex align-items-center p-3">
			<p class="mt-1 ms-3 fw-normal h6">
				ユーザー情報の更新が完了しました。
			</p>
		</div>

		<div class="container mt-3">
			<div class="row justify-content-center">
				<div class="col-8 pt-2">
					<p class="form-label text-start">社員ID</p>
					<div class="rounded-2 h-75 border border-black bg-light">
						<p class="mt-3 ms-2 fw-normal" th:text="${userDto.userId}"></p>
					</div>
				</div>
			</div>
		</div>

		<div class="container mt-3">
			<div class="row justify-content-center">
				<div class="col-8 pt-2">
					<p class="form-label text-start">名前</p>
					<div class="rounded-2 h-75 border border-black bg-light">
						<p class="mt-3 ms-2 fw-normal" th:text="${userDto.name}"></p>
					</div>
				</div>
			</div>
		</div>

		<div class="container mt-3">
			<div class="row justify-content-center">
				<div class="col-8 pt-2">
					<p class="form-label text-start">メールアドレス</p>
					<div class="rounded-2 h-75 border border-black bg-light">
						<p class="mt-3 ms-2 fw-normal" th:text="${userDto.mailAddress}"></p>
					</div>
				</div>
			</div>
		</div>

		<div class="container mt-3">
			<div class="row justify-content-center">
				<div class="col-8 pt-2">
					<p class="form-label text-start">所属課</p>
					<div class="rounded-2 h-75 border border-black bg-light">
						<p class="mt-3 ms-2 fw-normal" th:text="${userDto.departmentName}"></p>
					</div>
				</div>
			</div>
		</div>


		<!--         ================== 戻るボタン ================== -->
		<div class="border-0 mb-5 text-start">
			<a href="/admin/usersearch" class="text-black ms-1">
				<img src="/images/SOME_Return.png" style="width: 40px; height: 40px;">
			</a>
		</div>
	</section>
</body>

</html>
