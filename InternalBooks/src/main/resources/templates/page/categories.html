<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/layout :: layout(~{::title}, ~{::section})}">

<head>
    <title>カテゴリー</title>
</head>

<body>
<section class="vh-100 d-flex justify-content-center align-items-center">
	<div class="container vh-100 d-flex justify-content-center align-items-center">
	  <div class="w-100" style="max-width: 400px;">
	    <h1 class="mb-4 text-center">カテゴリー</h1>

	    <div class="row g-3">
	      <!-- 
	           2列レイアウトでカテゴリーボタンを表示
	           各カテゴリーに8色の色を割り当て表示する(9色目からは最初に戻る)
	           色を変更したい場合はth:withを変更する
	      -->
	      <div class="col-6" th:each="category, iterStat : ${categories}">
	        <a class="btn w-100"
	           th:with="bootstrapColorList=${'primary,success,warning,danger,info,secondary,light,dark'}"
	           th:classappend="${'btn-' + #strings.listSplit(bootstrapColorList, ',')[iterStat.index % 8]}"
	           th:href="@{'/page/book_detail?category=' + ${category}}"
	           th:text="${category}">Button</a>
	      </div>
	    </div>
		
	  </div>
	</div>
</section>
</body>
</html>
