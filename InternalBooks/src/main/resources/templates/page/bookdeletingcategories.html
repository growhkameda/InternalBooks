<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/layout :: layout(~{::title}, ~{::section})}">

<head>
	<title>削除対象カテゴリー</title>
</head>

<body>
	<section class="min-vh-100 d-flex justify-content-center align-items-center py-4">
		<div class="container d-flex justify-content-center align-items-center">
			<div class="w-100" style="max-width: 400px;">
				<h1 class="mb-4 text-center">カテゴリー</h1>
				<!-- エラー表示エリア -->
				<div class="alert alert-danger text-center" th:if="${error}" role="alert">
                    <span th:text="${error}"></span>
				</div>

				<!--2列レイアウト -->
				<div class="row g-3">
					<div class="col-6" th:each="category : ${categories}">

						<!--	  DBよりカテゴリーをリストで取得し、画面に表示-->
						<!--    カテゴリー毎にボタンのデザインを変更するために三項演算子を追記-->
					<a th:href="@{/admin/bookdeleting(category=${category})}" th:text="${category}"
						class="btn w-100 shadow py-3 fw-bold"
						style="background-color:white; color:#3CB371; border:2px solid #3CB371;">
					</a>
					</div>
				</div>

			<!-- ========== 管理者TOPへ戻るボタン ========== -->
			<div class="border-0 mt-4 mb-3 text-start">
				<a href="/admin/adminusertop" class="text-black ms-1">
					<img src="/images/TOP_Return.png" style="width: 40px; height: 40px;">
				</a>
			</div>

			<!-- ========== ページネーションボタン ========== -->
			<div class="d-flex justify-content-between mt-3">
				<div>
					<div th:if="${currentPage > 0}">
						<a th:href="@{/admin/bookdeletingcategories(page=${currentPage - 1})}"
							class="btn bg-success text-white">← 前のページ</a>
					</div>
				</div>
				<div th:if="${currentPage + 1 < totalPages}">
					<a th:href="@{/admin/bookdeletingcategories(page=${currentPage + 1})}"
						class="btn bg-success text-white">次のページ →</a>
				</div>
			</div>

		</div>
	</div>
</section>
</body>

</html>
