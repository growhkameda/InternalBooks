<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/layout :: layout(~{::title}, ~{::section})}">

<head>
	<title>User</title>
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<body>
	<section class="container justify-content-center mt-5">

		<h1 class="text-center">GrowLibrary</h1>
		<br>
		<h3 class="text-center mt-4">ユーザー登録</h3>
		<br>

		<form th:action="@{/admin/userconfir}" method="post" th:object="${userDto}"
			enctype="application/x-www-form-urlencoded">

			<!-- 社員ID -->
			<div class="container mt-4">
				<div class="row justify-content-center">

					<div class="col-8 pt-2">
						<label for="id" class="form-label text-start">社員ID</label>
						<!-- バリデーションエラーを表示 -->
						<span th:errors="*{userId}" class="text-danger ms-3"></span>
						<input type="text" th:field="*{userId}" class="form-control bg-light">
					</div>
				</div>
			</div>

			<!-- メールアドレス -->
			<div class="container mt-3">
				<div class="row justify-content-center">
					<div class="col-8 pt-2">
						<label for="mail" class="form-label text-start">メールアドレス </label>
						<!-- バリデーションエラーを表示 -->
						<span th:errors="*{mailAddress}" class="text-danger ms-3"></span>
						<input type="text" th:field="*{mailAddress}" class="form-control bg-light">
					</div>
				</div>
			</div>

			<!-- 名前 -->
			<div class="container mt-3">
				<div class="row justify-content-center">
					<div class="col-8 pt-2">
						<label for="name" class="form-label text-start">名前</label>
						<!-- バリデーションエラーを表示 -->
						<span th:errors="*{name}" class="text-danger ms-3"></span>
						<input type="text" th:field="*{name}" class="form-control bg-light">
					</div>
				</div>
			</div>


			<!-- 所属課  -->
			<div class="container mt-3">
				<div class="row justify-content-center">
					<div class="col-8 pt-2">
						<label for="department" class="form-label text-start">所属課</label>
						<!-- バリデーションエラーを表示 -->
						<span th:errors="*{departmentId}" class="text-danger ms-3"></span>
						<Select th:field="*{departmentId}" class="form-control bg-light">
							<option value="">選択してください</option>
							<option th:each="dept:${departments}" th:value="${dept.name}" th:text="${dept.name}">
							</option>
						</Select>
					</div>
				</div>
			</div>

			<!--         ================== Topへ戻るボタン ================== -->
			<div class="border-0 mb-5 text-start">
				<a href="/admin/adminusertop" class="text-black ms-1">
					<img src="/images/TOP_Return.png" style="width: 40px; height: 40px;">
				</a>
			</div>

			<!-- 登録確認 -->
			<div class="container text-center mt-4">
				<div class="col-auto">
					<button type="submit" class="btn btn-primary">登録確認</button>
				</div>
			</div>

		</form>
	</section>
</body>

</html>
