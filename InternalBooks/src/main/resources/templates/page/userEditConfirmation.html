<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/layout :: layout(~{::title}, ~{::section})}">

<head>
    <title>ユーザー編集確認</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<body>
    <section class="container justify-content-center mt-5">

        <h1 class="text-center">図書館システム</h1>
        <br>
        <h3 class="text-center mt-4">ユーザー編集確認</h3>
        <br>

        <div th:if="${passwordError}" class="alert alert-danger mt-2">
            <span th:text="${errorMessage}"></span>
        </div>

		<div class="h-25 border bg-body-secondary d-flex align-items-center">
        <p class="mt-1 ms-3 fw-normal h6">以下の編集内容を確定してよろしいですか？</p>
    </div>
    
    <form th:action="@{/admin/usereditcomplete}" th:object="${userDto}" method="post">
        
        <input type="hidden" th:field="*{userId}">
        <input type="hidden" th:field="*{name}">
        <input type="hidden" th:field="*{mailAddress}">
        <input type="hidden" th:field="*{departmentId}">

            <div class="container mt-4">
                <div class="row justify-content-center">
                    <div class="col-11 col-sm-8 pt-2">
                        <p class="form-label text-start">社員ID</p>
                        <div class="rounded-2 border border-black bg-secondary-subtle">
                            <p class="mt-3 ms-2 fw-normal" th:text="*{userId}"></p>
                        </div>
                    </div>
                </div>
            </div>

            <div class="container mt-3">
                <div class="row justify-content-center">
                    <div class="col-11 col-sm-8 pt-2">
                        <p class="form-label text-start">メールアドレス</p>
                        <div class="rounded-2 border border-black bg-light">
                            <p class="mt-3 ms-2 fw-normal" th:text="*{mailAddress}"></p>
                        </div>
                    </div>
                </div>
            </div>

            <div class="container mt-3">
                <div class="row justify-content-center">
                    <div class="col-11 col-sm-8 pt-2">
                        <p class="form-label text-start">名前</p>
                        <div class="rounded-2 border border-black bg-light">
                            <p class="mt-3 ms-2 fw-normal text-break" th:text="*{name}"></p>
                        </div>
                    </div>
                </div>
            </div>

            <div class="container mt-3">
                <div class="row justify-content-center">
                    <div class="col-11 col-sm-8 pt-2">
                        <p class="form-label text-start">所属課</p>
                        <div class="rounded-2 border border-black bg-light">
                            <p class="mt-3 ms-2 fw-normal" th:text="*{departmentName}"></p>
                        </div>
                    </div>
                </div>
            </div>

            <div class="container mt-3">
                <div class="row d-flex justify-content-center text-start">
                    <a th:href="@{/admin/useredit(userId=*{userId})}" class="col-11 col-sm-8 btn fs-6 text-start">
						<img src="/images/SOME_Return.png" style="width: 40px; height: 40px;">
                    </a>
                </div>
            </div>
            

	<!-- 編集ボタン -->
            <div class="container text-center mt-4">
                <div class="row justify-content-center">
                    <button type="submit"  class="btn bg-white text-success shadow btn-outline-secondary col-5 col-sm-3">確定</button>
                </div>
            </div>
        </form>
    </section>
</body>

</html>
