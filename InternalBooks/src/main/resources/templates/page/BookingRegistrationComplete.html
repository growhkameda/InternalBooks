<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/layout :: layout(~{::title}, ~{::section})}">

<head>
    <title>書籍登録完了</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<body>
<section class = "container justify-content-center mt-5">

    <h1 class= "text-center">図書館システム</h1>
    <br>
    <h3 class= "text-center mt-4">書籍登録完了</h3>
    <br>

	<!-- 完了ラベル -->
	<div class="text-dark">
	  <div class="container ms-2 text-center">
	    <div class="row justify-content-center">
	      <div class="col-12 bg-dark-subtle pt-2 text-start" style="height:40px">
	        書籍の登録が完了しました。
	      </div>
	    </div>
	  </div>
	</div>

	<!-- 画像 -->
	<div class="d-flex flex-column justify-content-center align-items-center my-3">
		<div class="col-7 d-flex justify-content-center border overflow-hidden"
					style="border-radius: 15px; aspect-ratio: 1; max-width: 500px;">
		   	  <div class = "p-5">
					 <img th:src="@{'/images/' + ${bookdto.imageUrl}}" alt="アップロード画像" 
				 		  class="w-100 h-100 object-fit-contain" style="border-radius: 10px">
		      </div>
		</div>
	</div>

	<!-- 書籍名・カテゴリー -->
	<div class ="container mt-5">
	  <div class = "d-flex justify-content-center align-items-center">
	   <div class = "col-9">
	    <p class= "fs-5 fw-bold text-start">書籍名</p>
	    <p class="text-start" th:text="${dbook.title}"></p>
	     <p class= "fs-5 fw-bold text-start">カテゴリー</p>
	    <p class="bg-primary text-light rounded-5 text-center" style="width: 100px;" th:text="${dbook.category}"></p>
	    </div>
	  </div>
	</div>

	<!-- 書籍提供者 -->
	<div class ="container mt-4">
	  <div class ="row justify-content-center">
		  <div class = "col-9 d-flex align-items-center">
				<label for = "booking" class="form-label text-start">書籍提供者:</label>
				<p class="ms-2 form-label text-start" th:text="${dbook.providerId}"></p>
		  </div>
	  </div>
	</div>

	<!-- コメント -->
	<div class ="container">
	  <div class ="row justify-content-center">
		    <div class = "col-9 pull-left ">
	            <p th:text="${dbook.providerComment}" class="form-control bg-light"style="height:150px; white-space: pre-wrap;">
		    </div>
		  </div>
	  </div>

	<!-- Topへ -->
	<div class="container mt-4">
		<div class="row justify-content-center mt-0 mb-5">
			<a href="/admin/adminusertop" class="col-9 text-black ms-1">
				<img src="/images/TOP_Return.png" style="width: 40px; height: 40px;">
			</a>
	    </div>
	</div>
</section>
</body>
</html>
