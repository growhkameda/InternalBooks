<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/layout :: layout(~{::title}, ~{::section})}">

<head>
    <title>書籍登録完了</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<body>
<section class = "container justify-content-center mt-5">

    <h1 class= "text-center">図書館システム</h1>
    <br>
    <h3 class= "text-center mt-4">書籍登録完了</h3>
    <br>

<!-- 完了ラベル -->
<div class="text-dark">
  <div class="container ms-2 text-center">
    <div class="row justify-content-center">
      <div class="col-12 bg-dark-subtle pt-2 text-start" style="height:40px">
        書籍の登録が完了しました。
      </div>
    </div>
  </div>
</div>

<!-- 画像 -->
<div class="text-center">
   	  <div class = "text-center">
			 <img th:src="${dbook.imageUrl}" alt="アップロード画像" class="img-fluid mt-4" style="height:400px">
      </div>
</div>

<!-- 書籍名・カテゴリー -->
<div class ="container mt-5">
  <div class = "d-flex justify-content-center align-items-center">
   <div class = "col-9">
    <p class= "fs-5 fw-bold text-start">書籍名</p>
    <p class="text-start" th:text="${dbook.title}"></p>
     <p class= "fs-5 fw-bold text-start">カテゴリー</p>
    <p class="bg-primary text-light rounded-5 text-center" style="width: 100px;" th:text="${dbook.category}"></p>
    </div>
  </div>
</div>

<!-- 書籍提供者 -->
<div class ="container mt-4">
  <div class ="row justify-content-center">
	  <div class = "col-9 d-flex align-items-center">
			<label for = "booking" class="form-label text-start">書籍提供者:</label>
			<p class="ms-2 form-label text-start" th:text="${dbook.providerId}"></p>
	  </div>
  </div>
</div>

<!-- コメント -->
<div class ="container">
  <div class ="row justify-content-center">
	    <div class = "col-9 pull-left ">
            <p th:text="${dbook.providerComment}" class="form-control bg-light"style="height:150px; white-space: pre-wrap;">
	    </div>
	  </div>
  </div>

<!-- Topへ -->
 <div class="container mt-5">
  <div class="d-flex justify-content-end align-items-center gap-1">
    <a href="/admin/adminusertop" class="btn fs-6">Topへ戻る</a>
    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor"
      class="bi bi-arrow-return-left" viewBox="0 0 16 16">
      <path fill-rule="evenodd"
        d="M14.5 1.5a.5.5 0 0 1 .5.5v4.8a2.5 2.5 0 0 1-2.5 2.5H2.707l3.347 3.346a.5.5 0 0 1-.708.708l-4.2-4.2a.5.5 0 0 1 0-.708l4-4a.5.5 0 1 1 .708.708L2.707 8.3H12.5A1.5 1.5 0 0 0 14 6.8V2a.5.5 0 0 1 .5-.5" />
    </svg>
  </div>
</div>
</section>
</body>
</html>
