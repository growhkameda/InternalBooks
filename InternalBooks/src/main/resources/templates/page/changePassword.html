<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
  th:replace="~{layout/layout :: layout(~{::title}, ~{::section})}">

  <head>
    <title>パスワード変更</title>
  </head>

<body>
  <section class="container mt-5">

    <h1 class="text-center">パスワード変更</h1>
    <br>

    <!-- エラー表示エリア -->
    <div
      th:if="${errorMessage}"
      class="alert alert-danger d-flex justify-content-center align-items-center text-center py-2"
      style="white-space: pre-line"
      role="alert">
      <span th:text="${errorMessage}"></span>
    </div>
    <br>

    <form th:action="@{/user/action/changePassword}" method="post" th:object="${changePasswordDto}">

      <!-- 新しいパスワード -->
      <div class="container text-center mt-4">
        <div class="row justify-content-center align-items-center pe-md-5">
          <div class="col-12 col-md-3 text-md-end text-center">
            <label for="newPassword">新しいパスワード</label>
          </div>
          <div class="col-12 col-md-8 ms-md-2">
            <div class="position-relative">
              <input type="password"
                     th:field="*{newPassword}"
                     class="form-control bg-light pe-5">
              <button type="button"
                      class="btn border-0 position-absolute top-50 end-0 translate-middle-y me-3 bg-transparent"
                      onclick="togglePassword('newPassword')">
                <i class="bi bi-eye"></i>
              </button>
            </div>
          </div>
        </div>
      </div>

      <!-- 新しいパスワード（確認） -->
      <div class="container text-center mt-4">
        <div class="row justify-content-center align-items-center pe-md-5">
          <div class="col-12 col-md-3 text-md-end text-center">
            <label for="confirmNewPassword">新しいパスワード（確認）</label>
          </div>
          <div class="col-12 col-md-8 ms-md-2">
            <div class="position-relative">
              <input type="password"
                     th:field="*{confirmNewPassword}"
                     class="form-control bg-light pe-5">
              <button type="button"
                      class="btn border-0 position-absolute top-50 end-0 translate-middle-y me-3 bg-transparent"
                      onclick="togglePassword('confirmNewPassword')">
                      <i class="bi bi-eye"></i>
              </button>
            </div>
          </div>
        </div>
      </div>

      <!-- パスワードポリシー表示 --> 
      <div class="container mt-5">
        <div class="row justify-content-center">
          <div class="col-auto text-start">
            <ul class="mb-0">
              <li>8文字以上で入力してください</li>
              <li>英字・数字をそれぞれ1文字以上含めてください</li>
              <li>使用可能な記号は半角英数字のみです</li>
            </ul>
          </div>
        </div>
      </div>

      <!-- 変更 -->
      <div class="container text-center mt-5">
        <div class="col-auto justify-content-center">
          <button
            type="submit"
            class="btn btn-lg col-5 col-sm-2 shadow fs-6"
            style="color: #47B78A">
            変更
          </button>
        </div>
      </div>

      <!-- ログイン画面へ戻る -->
      <div class="container mt-4">
        <div class="row justify-content-center mt-0 mb-5">
          <a th:href="@{/page/login}"
             class="col-11 col-sm-8 text-black ms-1">
            <img src="/images/SOME_Return.png"
                 style="width: 40px; height: 40px;">
          </a>
        </div>
      </div>
    </form>
    
    <!-- パスワード表示/非表示 --> 
    <script>
      function togglePassword(id) {
        const input = document.getElementById(id);
        const icon = input.nextElementSibling.querySelector("i");
        if (input.type === "password") {
          input.type = "text";
          icon.classList.remove("bi-eye");
          icon.classList.add("bi-eye-slash");
        } else {
          input.type = "password";
          icon.classList.remove("bi-eye-slash");
          icon.classList.add("bi-eye");
        }
      }
    </script>
    
  </section>
</body>

</html>
