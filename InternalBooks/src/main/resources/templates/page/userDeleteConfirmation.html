<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/layout :: layout(~{::title}, ~{::section})}">

<head>
	<title>User</title>
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<body>
	<section class="container justify-content-center mt-5">

		<h1 class="text-center">図書館システム</h1>
		<br>
		<h3 class="text-center mt-4">ユーザー削除確認</h3>
		<br>


		<div class="container text-center mt-3">
			<p class="bg-dark-subtle d-inline-block px-3 py-2 rounded">
				以下の社員を削除していいでしょうか？
			</p>
		</div>

		<form>

			<!-- 社員ID -->
			<div class="container mt-4">
				<div class="row justify-content-center">
					<div class="col-8 pt-2">

						<p class="form-label text-start">社員ID</p>
						<div class="rounded-2 h-75 border border-black">
							<p class="mt-3 ms-2 fw-normal  text-break" th:text="${users.userId}"></p>
						</div>
					</div>
				</div>
			</div>

			<!-- 名前 -->
			<div class="container mt-4">
				<div class="row justify-content-center">
					<div class="col-8 pt-2">

						<p class="form-label text-start">名前</p>
						<div class="rounded-2 h-75 border border-black">
							<p class="mt-3 ms-2 fw-normal text-break" th:text="${users.name}"></p>
						</div>
					</div>
				</div>
			</div>

			<!-- 所属課 -->
			<div class="container mt-4">
				<div class="row justify-content-center">
					<div class="col-8 pt-2">

						<p class="form-label text-start">所属課</p>
						<div class="rounded-2 h-75 border border-black">
							<p class="mt-3 ms-2 fw-normal " th:text="${userdepart.departmentName}"></p>
						</div>
					</div>
				</div>
			</div>

			<!-- 戻るボタン -->
			<div class="mb-5 text-start">
				<a th:href="@{/admin/userconfirmationscreen(userId=${users.userId})}" class="text-black ms-1">
					<img src="/images/SOME_Return.png" style="width: 40px; height: 40px;">
				</a>
			</div>

			<!-- 削除ボタン -->
			<div class="container text-center mt-5">
				<div class="col-12">
					<p class="col-4"></p>
					<a th:href="@{/admin/userdeletecomplete(userId=${users.userId})}"
						class="btn bg-white text-danger shadow btn-outline-secondary shadow  ms-6 col-4">削除</a>
					<p class="col-4"></p>
				</div>
			</div>
		</form>
	</section>
</body>

</html>
