<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/layout :: layout(~{::title}, ~{::section})}">

<head>
  <title>書籍登録確認</title>
</head>

<body>
  <section class="container justify-content-center mt-5">

    <h1 class="text-center">書籍登録確認</h1>
    <br>

    <!-- 書籍名 -->
    <div class="container mt-4">
      <div class="row justify-content-center gap">
        <div class="col-auto pt-2 ms-4">
          <label for="name">書籍名</label>
        </div>
        <div class="col-7 col-sm-8 ms-2">
          <p th:text="${bookdto.title}" class="form-control bg-white border-dark text-break"></p>
        </div>
      </div>
    </div>

    <!-- カテゴリー -->
    <div class="container mt-4">
      <div class="row justify-content-center">
        <div class="col-auto pt-2">
          <label for="category">カテゴリー</label>
        </div>
        <div class="col-7 col-sm-8">
          <p th:text="${bookdto.category}" class="form-control bg-white border-dark">
        </div>
      </div>
    </div>

    <!-- 書籍提供者 -->
    <div class="container mt-4">
      <div class="row justify-content-center">
        <div class="col-auto pt-2">
          <label for="id">書籍提供者</label>
        </div>
        <div class="col-7 col-sm-8">
          <p th:text="${bookdto.providerId}" class="form-control bg-white border-dark">
        </div>
      </div>
    </div>

    <!-- コメント -->
    <div class="container mt-4">
      <div class="row justify-content-center">
        <div class="col-auto pull-left pt-2">
          <label for="offer">書籍提供者</label>
          <br>
          <label for="offer">コメント</label>
        </div>
        <div class="col-7 col-sm-8">
          <p th:text="${bookdto.providerComment}" class="form-control bg-white border-dark text-break"
            style="height:150px; white-space: pre-wrap;">
        </div>
      </div>
    </div>

    <!-- 画像 -->
    <div class="container text-center mt-4">
      <div class="row justify-content-center">
        <div class="col-auto mt-1 pt-2 ms-3">
          <label for="id">書籍画像</label>
        </div>
        <div class="col-7 col-md-8 text-start">
          <img th:src="@{/admin/temp-image}" alt="アップロード画像" class="img-fluid mt-4 " style="height:200px">
        </div>
      </div>
    </div>

    <!-- 登録画面へ戻る -->
    <form th:action="@{/admin/dbback}" method="post" th:object="${bookdto}" enctype="multipart/form-data">

      <!-- hiddenで値を保持 -->
      <input type="hidden" th:field="*{title}">
      <input type="hidden" th:field="*{category}">
      <input type="hidden" th:field="*{providerId}">
      <input type="hidden" th:field="*{providerComment}">
      <input type="hidden" th:field="*{imageUrl}">

      <div class="container mt-5">
        <div class="row d-flex justify-content-center">
          <div class="col-11 col-md-8 text-start p-0">
            <button type="submit" class="btn">
<!--              編集画面へ戻る-->
				<img src="/images/SOME_Return.png" style="width: 40px; height: 40px;">
            </button>
          </div>
        </div>
      </div>
    </form>

    <!-- 登録 -->
    <form th:action="@{/admin/bookingregistrationcomplete}" method="post" th:object="${bookdto}"
      enctype="multipart/form-data">

      <div class="container text-center mt-4">
        <div class="row justify-content-center">
          <button type="submit" class="btn col-5 col-sm-4 shadow fs-6" style="color: #47B78A">登録</button>

          <!-- hiddenで値を保持 -->
          <input type="hidden" th:field="*{title}">
          <input type="hidden" th:field="*{category}">
          <input type="hidden" th:field="*{providerId}">
          <input type="hidden" th:field="*{providerComment}">
          <input type="hidden" th:field="*{imageUrl}">
        </div>
      </div>
    </form>
  </section>
</body>

</html>
