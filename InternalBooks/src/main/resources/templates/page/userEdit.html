<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/layout :: layout(~{::title}, ~{::section})}">

<head>
	<title>userEdit</title>
</head>

<body>
	<section class="container justify-content-center mt-5">

		<h1 class="text-center">図書館システム</h1>
		<br>
		<h3 class="text-center mt-4">ユーザー編集</h3>
		<br>

		<div th:if="${errorMessage}" class="container mt-3">
			<div class="row justify-content-center">
				<div class="col-8 alert alert-danger" role="alert">
					<span th:text="${errorMessage}"></span>
				</div>
			</div>
		</div>

		<form th:action="@{/admin/usereditconfirmation}" method="post" th:object="${userDto}"
			enctype="application/x-www-form-urlencoded">

			<div class="container mt-4">
				<div class="row justify-content-center">
					<div class="col-11 col-sm-8 pt-2">
						<label for="userId" class="form-label text-start">社員ID</label>
						<span th:errors="*{userId}" class="text-danger ms-3"></span>
						<input type="text" th:field="*{userId}" readonly class="form-control bg-secondary-subtle">
					</div>
				</div>
			</div>

			<div class="container mt-4">
				<div class="row justify-content-center">
					<div class="col-11 col-sm-8 pt-2">
						<label for="name" class="form-label text-start">名前</label>
						<span th:errors="*{name}" class="text-danger ms-3"></span>
						<input type="text" th:field="*{name}" class="form-control bg-light">
					</div>
				</div>
			</div>

			<div class="container mt-4">
				<div class="row justify-content-center">
					<div class="col-11 col-sm-8 pt-2">
						<label for="mailAddress" class="form-label text-start">メールアドレス</label>
						<span th:errors="*{mailAddress}" class="text-danger ms-3"></span>
						<input type="text" th:field="*{mailAddress}" class="form-control bg-light">
					</div>
				</div>
			</div>

			<div class="container mt-4">
				<div class="row justify-content-center">
					<div class="col-11 col-sm-8 pt-2">
						<label for="departmentId" class="form-label text-start">所属課</label>
						<span th:errors="*{departmentId}" class="text-danger ms-3"></span>
						<select th:field="*{departmentId}" class="form-select bg-light">
							<option value="">選択してください</option>
							<option th:each="dept : ${mDepartmentList}" th:value="${dept.id}" th:text="${dept.name}">
							</option>
						</select>
					</div>
				</div>
			</div>

			<!-- ================== 戻るボタン ================== -->
			<div class="row border-0 mt-3 mb-5 d-flex justify-content-center text-start">
				<a href="/admin/usersearch" class="col-11 col-sm-8 text-black ms-3">
					<img src="/images/SOME_Return.png" style="width: 40px; height: 40px;">
				</a>
			</div>

			<!-- ================== 編集ボタン ================== -->
			<div class="container text-center mt-4">
				<div class="col-12">
					<button type="submit" class="btn btn-success col-6 col-sm-4">編集</button>
				</div>
			</div>

		</form>
	</section>
</body>

</html>
