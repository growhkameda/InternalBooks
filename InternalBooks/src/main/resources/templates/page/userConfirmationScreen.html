<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/layout :: layout(~{::title}, ~{::section})}">

<head>
    <title>userConfirmationScreen</title>
</head>

<body>
<section class = "container justify-content-center mt-5">
	
    <h1 class= "text-center">図書館システム</h1>
    <br>
    <h2 class= "text-center mt-4">ユーザー確認画面</h2>
    <br>
<form>    
	<div class ="container mt-4">
	  <div class = "row justify-content-center">
		  <div class = "col-8 pt-2">
		      	<p for = "id" class="form-label text-start">社員ID</p>
				<div class="rounded-2 h-75 border border-black">
				  <p class="mt-3 ms-2 fw-normal h6">0001</p>
			    </div>
		  </div>
	  </div>
	</div>

<div class ="container mt-4">
  <div class = "row justify-content-center">
	  <div class = "col-8 pt-2">
	      	<p for = "id" class="form-label text-start">名前</p>
			<div class="rounded-2 h-75 border border-black">
			  <p class="mt-3 ms-2 fw-normal h6">武藤 秀平</p>
		    </div>
	  </div>
  </div>
</div>

<div class ="container mt-4">
  <div class = "row justify-content-center">
	  <div class = "col-8 pt-2">
	      	<p for = "id" class="form-label text-start">所属課</p>
			<div class="rounded-2 h-75 border border-black">
			  <p class="mt-3 ms-2 fw-normal h6">開発課</p>
		    </div>
	  </div>
  </div>
</div>
  <div class ="input-group mt-5 gap-1">
     <div class ="row justify-content-start"> 
	   <div class = "col-12 ms-lg-5 ps-lg-5">
			<a href="/admin/adminusertop" class="btn fs-6 ">一覧へ戻る</a>
			<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-arrow-return-left" viewBox="0 0 16 16">
            <path fill-rule="evenodd" d="M14.5 1.5a.5.5 0 0 1 .5.5v4.8a2.5 2.5 0 0 1-2.5 2.5H2.707l3.347 3.346a.5.5 0 0 1-.708.708l-4.2-4.2a.5.5 0 0 1 0-.708l4-4a.5.5 0 1 1 .708.708L2.707 8.3H12.5A1.5 1.5 0 0 0 14 6.8V2a.5.5 0 0 1 .5-.5"/>
            </svg>
	   </div>
   　</div>
   </div>
   
   <!--同じ行に編集ボタンと削除ボタンを配置し、左右と真ん中にそれぞれスペースを置く-->
   <div class ="container text-center mt-4">
	  <div class ="row">
		 <p class = "col-1"></p>
	 　　<a href="/admin/useredit" class="btn btn-success ms-6 col-4">編集</a>
	     <p class = "col-2"></p>
		 <a href="/admin/userdeleteconfirmation" class="btn btn-danger ms-6 col-4">削除</a>
		 <p class = "col-1"></p>
	  </div>
    </div>
</form>
</section>
</body>
</html>
