<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/layout :: layout(~{::title}, ~{::section})}">

<head>
    <title>userConfirmationScreen</title>
</head>

<body>


    <h1 class="text-center">図書館システム</h1>
    <br>
    <h2 class="text-center mt-4">ユーザー確認画面</h2>
    <br>

    <form>

        <!-- 社員ID -->
        <div class="container mt-4">
            <div class="row justify-content-center">
                <div class="col-8 pt-2">
                    <p class="form-label text-start">社員ID</p>
                    <div class="rounded-2 h-75 border border-black">
                        <p class="mt-3 ms-2 fw-normal" th:text="${users.userId}"></p>
                    </div>
                </div>
            </div>
        </div>

        <!-- 名前 -->
        <div class="container mt-4">
            <div class="row justify-content-center">
                <div class="col-8 pt-2">
                    <p class="form-label text-start">名前</p>
                    <div class="rounded-2 h-75 border border-black">
                        <p class="mt-3 ms-2 fw-normal" th:text="${users.name}"></p>
                    </div>
                </div>
            </div>
        </div>

        <!-- 所属課 -->
        <div class="container mt-4">
            <div class="row justify-content-center">
                <div class="col-8 pt-2">
                    <p class="form-label text-start">所属課</p>
                    <div class="rounded-2 h-75 border border-black">
                        <p class="mt-3 ms-2 fw-normal"
                           th:text="${userdepart.departmentName}"></p>
                    </div>
                </div>
            </div>
        </div>

        <!-- 一覧へ戻る -->
        <div class="input-group mt-5 gap-1">
            <div class="row justify-content-start">
                <div class="col-12 ms-lg-5 ps-lg-5">
                    <a href="/admin/adminusertop" class="btn fs-6">一覧へ戻る</a>
                    <svg xmlns="http://www.w3.org/2000/svg"
                         width="16"
                         height="16"
                         fill="currentColor"
                         class="bi bi-arrow-return-left"
                         viewBox="0 0 16 16">
                        <path fill-rule="evenodd"
                              d="M14.5 1.5a.5.5 0 0 1 .5.5v4.8a2.5 2.5 0 0 1-2.5 2.5H2.707l3.347 3.346a.5.5 0 0 1-.708.708l-4.2-4.2a.5.5 0 0 1 0-.708l4-4a.5.5 0 1 1 .708.708L2.707 8.3H12.5A1.5 1.5 0 0 0 14 6.8V2a.5.5 0 0 1 .5-.5"/>
                    </svg>
                </div>
            </div>
        </div>

        <!-- 編集・削除ボタン -->
        <div class="container text-center mt-4">
            <div class="row">
                <p class="col-1"></p>

                <a href="/admin/useredit"
                   class="btn btn-success ms-6 col-4">編集</a>

                <p class="col-2"></p>

                <a th:href="@{/admin/userdeleteconfirmation(userId=${users.userId})}"
                   class="btn btn-danger ms-6 col-4">削除</a>

                <p class="col-1"></p>
            </div>
        </div>

    </form>
</section>
</body>
</html>
