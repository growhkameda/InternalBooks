<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/layout :: layout(~{::title}, ~{::section})}">

<head>
	<title>userConfirmationScreen</title>
</head>

<body>

	<section>
		<h1 class="text-center">図書館システム</h1>
		<br>
		<h2 class="text-center mt-4">ユーザー確認画面</h2>
		<br>

		<div class="h-25 border bg-body-secondary d-flex align-items-center">
			<p class="mt-1 ms-3 fw-normal h6">ユーザーの詳細情報は以下の通りです。</p>
		</div>

		<!-- 社員ID -->
		<div class="container mt-4">
			<div class="row justify-content-center">
				<div class="col-8 pt-2">
					<p class="form-label text-start">社員ID</p>
					<div class="rounded-2 border border-black">
						<p class="mt-3 ms-2 fw-normal" th:text="${userDto.userId}"></p>
					</div>
				</div>
			</div>
		</div>

		<!-- 名前 -->
		<div class="container mt-4">
			<div class="row justify-content-center">
				<div class="col-8 pt-2">
					<p class="form-label text-start">名前</p>
					<div class="rounded-2 border border-black">
						<p class="mt-3 ms-2 fw-normal" th:text="${userDto.name}"></p>
					</div>
				</div>
			</div>
		</div>

		<!-- メールアドレス -->
		<div class="container mt-4">
			<div class="row justify-content-center">
				<div class="col-8 pt-2">
					<p class="form-label text-start">メールアドレス</p>
					<div class="rounded-2 border border-black">
						<p class="mt-3 ms-2 fw-normal" th:text="${userDto.mailAddress}"></p>
					</div>
				</div>
			</div>
		</div>


		<!-- 所属課 -->
		<div class="container mt-4">
			<div class="row justify-content-center">
				<div class="col-8 pt-2">
					<p class="form-label text-start">所属課</p>
					<div class="rounded-2 border border-black">
						<p class="mt-3 ms-2 fw-normal" th:text="${userDto.departmentName}"></p>
					</div>
				</div>
			</div>
		</div>


		<!-- ==========ユーザー検索画面へ戻るボタン ========== -->
		<div class="row d-flex justify-content-center border-0 mt-3">
			<a href="/admin/usersearch" class="text-black ms-1">
				<img src="/images/SOME_Return.png" style="width: 40px; height: 40px;">
			</a>
		</div>



		<div class="container text-center mt-4">
			<div class="row d-flex justify-content-between ">
		<!-- 編集ボタン -->
				<a th:href="@{/admin/useredit(userId=${userDto.userId})}" class="btn bg-white text-success shadow btn-outline-secondary shadow  ms-6 col-4">編集</a>
		<!-- 削除ボタン -->
				<a th:href="@{/admin/userdeleteconfirmation(userId=${userDto.userId})}" class="btn bg-white text-danger shadow btn-outline-secondary shadow  ms-6 col-4">削除</a>
			</div>
		</div>

	</section>
</body>

</html>
