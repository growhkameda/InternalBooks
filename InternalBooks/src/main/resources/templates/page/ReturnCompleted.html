<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/layout :: layout(~{::title}, ~{::section})}">

<head>
  <title>検索結果詳細</title>
</head>

<body>
  <section th:fragment="section">

    <!-- ================== ページメインタイトル ================== -->
    <div class="container-sm text-center mt-4">
  		<h1 class="fw-bold mt-4 display-4 mb-4">返却完了</h1>
		<p>書籍の返却が完了しました。</p>
    </div>

    <!-- ================== 書籍情報がない場合の表示 ================== -->
    <div th:if="${book == null}" class="text-center text-muted mt-5 pt-5">
      <!-- 本のアイコン表示 -->
      <i class="bi bi-book display-1 text-secondary"></i>
      <!-- メッセージ表示 -->
      <p class="fs-5 mt-4">書籍が見つかりませんでした</p>
      <!-- トップページへの戻りボタン -->
      <div class="col-12 border-0 mt-4">
        <a href="/page/top" class="text-black ms-2">
            TOPに戻る
            <i class="bi bi-arrow-return-left ms-1"></i>
        </a>
      </div>
    </div>

    <!-- ================== 書籍情報がある場合の表示 ================== -->
    <div th:if="${book != null}"
         class="container-sm">

		<!-- ========== 書籍カード表示 ========== -->
	    <div class="d-flex flex-column justify-content-center align-items-center mb-1">
	 		<!-- 書籍画像エリア -->
	 		<div class="col-7 d-flex justify-content-center border overflow-hidden"
	 						 style="border-radius: 15px; aspect-ratio: 1; max-width: 500px;">
	 			<div class="p-5">
	 		  		<img th:src="@{'/images/' + ${book.bookId} + '.png'}"
	                 	 class="w-100 h-100 object-fit-contain"
	               		 alt="書籍画像"
	                		 onerror="handleImageError(this)" style="border-radius: 10px">
	     		</div>
	 	 </div>

        <!-- 書籍情報エリア -->
        <div class="card-body p-4 pt-1">
          <!-- 書籍名 -->
          <h5 class="card-title fw-bold mb-3 text-dark" th:text="${book.title}">書籍名</h5>
        </div>
      </div>

	<div class="row d-flex justify-content-center mb-4">
		<label class="col-8" for="comment">感想・コメント</label>
		<p th:text="${bookHistory != null ? bookHistory.review : ''}" class="col-8 pt-2 pb-2"
		   style="background-color: #E8ECE8; border-radius: 10px;">
		   文章が入ります
	   </p>
	</div>

	  <!-- ========== TOPへ戻るボタン ========== -->
      <div class="row d-flex justify-content-center border-0 mt-0 mb-5">
  		<a href="/page/top" class="text-black p-0" style="width: 140px; height: 40px;">
  			<img src="/images/TOP_Go.png" style="width: 140px; height: 40px;">
  		</a>
      </div>

      <!-- ========== 書籍履歴テーブル ========== -->
      <div class="row d-flex justify-content-center mb-4">
		<h5 class="col-11 col-sm-8 fw-bold mb-2">書籍履歴</h5>
		<!-- ========== 履歴がない場合 ========== -->
		 <div class="text-center return" th:if="${#lists.isEmpty(bookHistoryList)}">
            <p class="text-center text-muted">履歴がありません</p>
		 </div>
		<!-- ========== 履歴表示 ========== -->
		<th:block th:each="history : ${bookHistoryList}">
			<div th:if="${history.returnDate != null}" class="d-flex justify-content-center col-11 col-sm-8"
				 style="background-color: #94C5AF; border-radius: 10px; min-height: 70px; padding: 8px 0;">
				<b class="col-3 col-sm-3 d-flex justify-content-start align-items-center">返却</b>
				<div class="col-7 col-sm-7 d-flex flex-column justify-content-center">
					<p th:text="${history.userName}" class="mb-0">武藤</p>
					<p th:text="${history.returnDate}" class="mb-0">2026年1月1日</p>
				</div>
			</div>
			<div th:if="${history.lendingDate != null}" class="d-flex justify-content-center col-11 col-sm-8 mt-2 mb-4"
				 style="background-color: #6D8E7B; border-radius: 10px; min-height: 70px; padding: 8px 0;">
				<b class="col-3 col-sm-3 d-flex justify-content-start align-items-center">貸出</b>
				<div class="col-7 col-sm-7 d-flex flex-column justify-content-center">
					<p th:text="${history.userName}" class="mb-0">武藤</p>
					<p th:text="${history.lendingDate}" class="mb-0">2026年1月1日</p>
				</div>
			</div>
		</th:block>

		<h5 class="col-11 col-sm-8 fw-bold mb-2 mt-5">書籍感想</h5>
		<!-- ========== 感想がない場合 ========== -->
		<div class="text-center return" 
			 th:if="${#lists.isEmpty(bookHistoryList) 
		             or (bookHistoryList[0].returnDate == null and #strings.isEmpty(bookHistoryList[0].review))}">
	    	<p class="text-center text-muted">この書籍はまだ感想がありません</p>
		</div>
		<th:block th:each="history : ${bookHistoryList}">
			<!-- ========== 感想表示 ========== -->
			<div th:if="${!#strings.isEmpty(history.review)}"
				 class="d-flex flex-column justify-content-center shadow col-11 col-sm-8 mb-4" style="background-color: #E5EAE5; border-radius: 10px;">
				<p th:text="${history.review}" class="col-12 mt-2 mb-0">感想</p>
				<div class="d-flex mt-3 justify-content-end me-4">
					<p th:text="${history.userName}" class="me-3">武藤</p>
					<p th:text="${history.returnDate}" class="">2026年1月1日</p>
				</div>
			</div>
		</th:block>
		  <style>
  		      .comment {
  		          height: 0px;
  		          overflow: hidden;           /* はみ出しを隠す */
  		          opacity: 0;                 /* 透明 */
  		          /* transform: translateY(-10px); */
  		          /* transition: all 0.6s ease; */
  		          pointer-events: none;
  		          border: 1px white;
  		          transition: none; /* ← 通常時はアニメーションなし */
  		          margin: 0px;
  		      }

  		      .comment p {
  		          height: 0px;
  		          opacity: 0;
  		      }

  		      .return:hover + .comment,
  		      .comment:hover {
  		          height: 100px;
  		          max-height: 100px;          /* アニメーションで高さを展開 */
  		          opacity: 1;                 /* フェードイン */
  		          transform: translateY(0);   /* 元の位置に移動 */
  		          pointer-events: auto;
  		          transition: all 0.6s ease; /* ← hover時だけアニメーション */
  		      }

  		      .return:hover + .comment p,
  		      .comment:hover p {
  		          opacity: 1;
  		          height: 30px;
  		          transition: all 0.6s ease; /* ← hover時だけアニメーション */
  		      }

  		      .return:hover + .comment p:nth-child(2),
  		      .comment:hover p:nth-child(2) {
  		          opacity: 1;                 /* フェードイン */
  		          height: 50px;
  		      }

  		      .lending {
  		          /* transform: translateY(-1px); */
  		          transition: all 0.6s ease;  /* アニメーション */
  		          border: 1px white;
  		      }

  		      .return:hover ~ .lending,
  		      .comment:hover ~ .lending {
  		          transform: translateY(0);
  		      }
  		  </style>
        </div>
      </div>

  </section>

  <!-- 画像エラー処理用JavaScript -->
  <script>
    function handleImageError(img) {
      // 無限ループを防ぐため、既にエラー処理済みの場合は何もしない
      if (img.dataset.errorHandled === 'true') {
        return;
      }
      
      // エラー処理済みフラグを設定
      img.dataset.errorHandled = 'true';
      
      // 画像の代わりにBootstrapアイコンを表示するため、親要素を変更
      const parent = img.parentElement;
      parent.innerHTML = `
        <div class="d-flex align-items-center justify-content-center py-5 text-muted">
          <i class="bi bi-book display-2"></i>
        </div>
      `;
    }
  </script>
</body>
</html>
