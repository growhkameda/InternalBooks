<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/layout :: layout(~{::title}, ~{::section})}">

<head>
  <title>検索結果詳細</title>
</head>

<body>
  <section th:fragment="section">

    <!-- ================== ページメインタイトル ================== -->
    <div class="container-sm text-center mt-4">
  		<h1 class="fw-bold mt-4 display-4 mb-4">返却完了</h1>
		<p>書籍の返却が完了しました。</p>
    </div>

    <!-- ================== 書籍情報がない場合の表示 ================== -->
    <div th:if="${book == null}" class="text-center text-muted mt-5 pt-5">
      <!-- 本のアイコン表示 -->
      <i class="bi bi-book display-1 text-secondary"></i>
      <!-- メッセージ表示 -->
      <p class="fs-5 mt-4">書籍が見つかりませんでした</p>
      <!-- トップページへの戻りボタン -->
      <div class="col-12 border-0 mt-4">
        <a href="/page/top" class="text-black ms-2">
            TOPに戻る
            <i class="bi bi-arrow-return-left ms-1"></i>
        </a>
      </div>
    </div>

    <!-- ================== 書籍情報がある場合の表示 ================== -->
    <div th:if="${book != null}" 
         class="container-sm">
      
      <!-- ========== 書籍カード表示 ========== -->
      <div class="text-center mb-1">
        <!-- 書籍画像エリア -->
		<div class="text-center p-4">
<!--		  <img th:src="@{|/images/${book.bookId}.png|}" -->
		  <img th:src="@{'/images/' + '100' + ${book.bookId} + '.png'}"
               class="img-fluid rounded shadow w-25 h-auto" 
               alt="書籍画像"
               onerror="handleImageError(this)" />
        </div>
		
        
        <!-- 書籍情報エリア -->
        <div class="card-body p-4 pt-1">
          <!-- 書籍名 -->
          <h5 class="card-title fw-bold mb-3 text-dark" th:text="${book.title}">書籍名</h5>
          
          <!-- カテゴリー -->
          <div class="mb-3">
			<span th:each="category : ${categories}"
			      class="badge bg-primary rounded-pill me-3 px-3 py-2 fs-6"
			      th:text="${category}">
  				カテゴリー
	    	</span>
          </div>
        </div>
      </div>
	
	<div class="row d-flex justify-content-center mb-4">
		<label class="col-8" for="comment">感想・コメント</label>
		<p th:text="${tlend.review}" class="col-8 ps-2" style="background-color: #E8ECE8; height: 50px; border-radius: 10px;"></p>
	</div>

      <!-- ========== 一覧へ戻るボタン ========== -->
      <div class="row d-flex justify-content-center border-0 mt-0 mb-5">
        <a href="/page/top" class="col-8 text-black ms-1">
             TOPへ戻る
             <i class="bi bi-arrow-return-left ms-1"></i>
        </a>
      </div>

      <!-- ========== 書籍履歴テーブル ========== -->
      <div class="row d-flex justify-content-center mb-4">
        <h6 class="col-8 fw-bold mb-2">書籍履歴</h6>
        <div class="col-8 table-responsive">
          <table class="table table-striped table-sm">
            <thead class="table-primary">
              <tr>
                <th scope="col" class="text-center border-end border-2 border-white">日付</th>
                <th scope="col" class="text-center border-end border-2 border-white">ユーザー</th>
                <th scope="col" class="text-center border-end border-2 border-white">貸出履歴</th>
              </tr>
            </thead>
			<tbody>
              <!-- 履歴データの表示 -->
                <!----------------------------ここに履歴データの表示を追加してください------------------------>
              <!-- 履歴がない場合 -->
			 <tr class="text-center return" th:if="${#lists.isEmpty(bookHistoryList)}">
                <td colspan="3" class="text-center text-muted">履歴がありません</td>
			 </tr>
			 
			 <th:block th:each="history : ${bookHistoryList}">
			 
			 <!-- 履歴がある場合 -->
			 <!-- 返却履歴 -->
			 <tr class="text-center return" th:if="${history.returnDate != null}">
 				<td th:text="${history.returnDate}" class="text-white" style="background-color: #15B2EE;">5月29日</td>
 				<td th:text="${history.userName}" class="text-white" style="background-color: #15B2EE;">武藤</td>
 				<td class="text-white" style="background-color: #15B2EE;">返却</td>
             </tr>
  			  
 			  <tr class="comment" th:if="${tlend.review != null}">
 				<td colspan="3" class="p-0" style="background-color: #15B2EE;">
 					<p class="col-8 text-white mb-0 mx-1">感想・コメント</p>
 					<p th:text="${tlend.review}" class="ps-1 mx-1 my-0" style="background-color: #E8ECE8; border-radius: 10px;"></p>
 				</td>
 			  </tr>
  			  
 			  <tr class="text-center lending" th:if="${history.lendingDate != null}">
   				<td th:text="${history.lendingDate}" style="background-color: #99B9C5; color: #fff;">5月20日</td>
   				<td th:text="${history.userName}" style="background-color: #99B9C5; color: #fff;">武藤</td>
   				<td style="background-color: #99B9C5; color: #fff;">貸出</td>
			  </tr>
            </tbody>
          </table>
		  <style>
  		      .comment {
  		          height: 0px;
  		          overflow: hidden;           /* はみ出しを隠す */
  		          opacity: 0;                 /* 透明 */
  		          /* transform: translateY(-10px); */
  		          /* transition: all 0.6s ease; */
  		          pointer-events: none;
  		          border: 1px white;
  		          transition: none; /* ← 通常時はアニメーションなし */
  		          margin: 0px;
  		      }

  		      .comment p {
  		          height: 0px;
  		          opacity: 0;
  		      }
  		      
  		      .return:hover + .comment,
  		      .comment:hover {
  		          height: 100px;
  		          max-height: 100px;          /* アニメーションで高さを展開 */
  		          opacity: 1;                 /* フェードイン */
  		          transform: translateY(0);   /* 元の位置に移動 */
  		          pointer-events: auto;
  		          transition: all 0.6s ease; /* ← hover時だけアニメーション */
  		      }

  		      .return:hover + .comment p,
  		      .comment:hover p {
  		          opacity: 1;
  		          height: 30px;
  		          transition: all 0.6s ease; /* ← hover時だけアニメーション */
  		      }

  		      .return:hover + .comment p:nth-child(2),
  		      .comment:hover p:nth-child(2) {
  		          opacity: 1;                 /* フェードイン */
  		          height: 50px;
  		      }
  		      
  		      .lending {
  		          /* transform: translateY(-1px); */
  		          transition: all 0.6s ease;  /* アニメーション */
  		          border: 1px white;
  		      }
  		      
  		      .return:hover ~ .lending,
  		      .comment:hover ~ .lending {
  		          transform: translateY(0);
  		      }
  		  </style>
        </div>
      </div>
    </div>

  </section>



  <!-- 画像エラー処理用JavaScript -->
  <script>
    function handleImageError(img) {
      // 無限ループを防ぐため、既にエラー処理済みの場合は何もしない
      if (img.dataset.errorHandled === 'true') {
        return;
      }
      
      // エラー処理済みフラグを設定
      img.dataset.errorHandled = 'true';
      
      // 画像の代わりにBootstrapアイコンを表示するため、親要素を変更
      const parent = img.parentElement;
      parent.innerHTML = `
        <div class="d-flex align-items-center justify-content-center py-5 text-muted">
          <i class="bi bi-book display-2"></i>
        </div>
      `;
    }
  </script>
</body>
</html>
