<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/layout :: layout(~{::title}, ~{::section})}">

<head>
  <title>検索結果詳細</title>
</head>

<body>
  <section th:fragment="section">

    <!-- ================== ページメインタイトル ================== -->
    <div class="container-sm text-center mt-4">
  		<h1 class="fw-bold mt-4 display-4 mb-4">検索結果詳細</h1>
    </div>

    <!-- ================== 書籍情報がない場合の表示 ================== -->
    <div th:if="${book == null}" class="text-center text-muted mt-5 pt-5">
      <!-- 本のアイコン表示 -->
      <i class="bi bi-book display-1 text-secondary"></i>
      <!-- メッセージ表示 -->
      <p class="fs-5 mt-4">書籍が見つかりませんでした</p>
      <!-- トップページへの戻りボタン -->
      <div class="col-12 border-0 mt-4">
        <a href="/page/top" class="text-black ms-2">
            TOPに戻る
            <i class="bi bi-arrow-return-left ms-1"></i>
        </a>
      </div>
    </div>

    <!-- ================== 書籍情報がある場合の表示 ================== -->
    <div th:if="${book != null}" 
         class="container-sm">
      
      <!-- ========== 書籍カード表示 ========== -->
      <div class="text-center mb-1">
        <!-- 書籍画像エリア -->
<!--        <div class="text-center p-4">-->
<!--          <img th:src="@{${book.imageUrl}}" -->
<!--               class="img-fluid rounded shadow w-25 h-auto" -->
<!--               alt="書籍画像"-->
<!--               onerror="handleImageError(this)" />-->
<!--        </div>-->
		
		<div class="text-center p-4">
          <img th:src="@{/images/1001.png}" 
               class="img-fluid rounded shadow w-25 h-auto" 
               alt="書籍画像"
               onerror="handleImageError(this)" />
        </div>
		
        
        <!-- 書籍情報エリア -->
        <div class="card-body p-4 pt-1">
          <!-- 書籍名 -->
          <h5 class="card-title fw-bold mb-3 text-dark" th:text="${book.title}">書籍名</h5>
          
          <!-- カテゴリー -->
          <div class="mb-3">
<!--            <span class="badge bg-primary rounded-pill px-3 py-2 fs-6" -->
<!--                  th:text="${book.category}">カテゴリー</span>-->
				  
			<span th:each="category : ${categories}"
			      class="badge bg-primary rounded-pill me-3 px-3 py-2 fs-6"
			      th:text="${category}">
  				カテゴリー
	    	</span>
          </div>
          
          <!-- 貸出状況 -->
          <div class="mb-0">
			<p>貸出状況</p>
            <span th:if="${book.status == '貸出中'}" class="text-danger fw-bold">貸出中</span>
            <span th:if="${book.status != '貸出中'}" class="text-success fw-bold">貸出可能</span>
          </div>
        </div>
      </div>
	  
	  <!--借りる際のウィンドウ-->
	  <!--	<div id="b-confirmation" class="col-6 pt-3 position-fixed top-50">-->
	  <!--		<p class="text-center mt-5" style="font-size: 20px;">この書籍を借りますか？</p>-->
	  <!--		 <div class="d-flex h-25">-->
	  <!--			<button class="w-50 border border-0" style="background-color: #494CD8; border-bottom-left-radius: 10px;">-->
	  <!--				<a href="#" class="text-white text-decoration-none">借りる</a>-->
	  <!--			</button>-->
	  <!--			<button class="w-50 border border-0" onclick="window.close();" style="background-color: #ADACBD; border-bottom-right-radius: 10px;">-->
	  <!--				<p class="m-0 text-white">キャンセル</p>-->
	  <!--			</button>-->
	  <!--		 </div>-->
	  <!--	</div>-->
	  	
	  	<style>
	  		#b-confirmation,
	  		#r-confirmation {
	  			display: flex;
	  			flex-flow: column;
	  			justify-content: space-between;
	  			left: 25%;
	  			border-radius: 10px;
	  			height: 180px;
	  		}
	  		
	  		#b-confirmation {
	  			background-color: #E8E8EC;
	  		}
	  		
	  		#r-confirmation{
	  			background-color: #ECE8E8;
	  		}
	  	</style>
	  	
	  	<!--返す際のウィンドウ-->
	  	<div id="r-confirmation" class="col-6 pt-4 position-fixed top-50" style="display: none; z-index: 999;">
	  		<p class="text-center mt-5 mb-5" style="font-size: 20px;">この書籍を返却しますか？</p>
	  		<div class="d-flex h-25">
	  			<button class="w-50 border border-0" style="background-color: #E83838; border-bottom-left-radius: 10px;"
				onclick="document.getElementById('return-form').submit();">
	  				返す
	  			</button>
	  			<button class="w-50 border border-0" onclick="hideConfirmation()" style="background-color: #BDACAC; border-bottom-right-radius: 10px;">
	  				キャンセル
	  			</button>
	  		 </div>
	  	</div>
	  
	  
	 <div class="row d-flex justify-content-center">
	 	<p class="col-8">書籍提供者：武藤</p>
	 	<p th:text="${book.providerComment}" class="col-8 p-3" style="background-color: #E8ECE8; border-radius: 10px;">
		書籍提供者コメント
		</p>
	</div>
	
	<div class="row d-flex justify-content-center mb-4">
		<label class="col-8" for="comment">感想・コメント</label>
		<textarea id="comment" name="review" class="col-8 ps-2" placeholder="こちらに感想やコメントを記入してください。" style="background-color: #E8ECE8; border-radius: 10px; border: 0px none;;"></textarea>
	</div>
	
<!--	<p th:text="${book.Memo}"></p>-->

      <!-- ========== 一覧へ戻るボタン ========== -->
      <div class="row d-flex justify-content-center border-0 mt-0 mb-5">
        <a href="/page/top" class="col-8 text-black ms-1">
             TOPへ戻る
             <i class="bi bi-arrow-return-left ms-1"></i>
        </a>
      </div>

		<!-- ========== 返却/借りるボタン（QRサーチまたは貸出中書籍ページからの遷移時のみ表示） ========== -->
		<div th:if="${showReturnButton == true}" class="text-center mb-5">
        	<!-- 貸出中の場合は返却ボタン -->
			<div th:if="${book.status == '貸出中'}">
			  <form id="return-form" method="post" th:action="@{/遷移先書いてください}" class="d-inline">
			    <input type="hidden" name="bookId" th:value="${book.bookId}" />
			    <button type="button" class="btn btn-danger btn-lg w-25" onclick="showConfirmation()">
			      返す
			    </button>
			  </form>
			</div>
        
			<!-- 貸出可能の場合は借りるボタン -->
			<div th:if="${book.status != '貸出中'}">
			  <form method="post" th:action="@{/遷移先書いてください}" class="d-inline">
			    <input type="hidden" name="bookId" th:value="${book.bookId}" />
			    <button type="submit" class="btn btn-primary btn-lg w-25">
			      借りる
			    </button>
			  </form>
			</div>
		</div>
		
		<script>
			function showConfirmation() {
			    document.getElementById("r-confirmation").style.display = "block";
			}

			function hideConfirmation() {
			    document.getElementById("r-confirmation").style.display = "none";
			}
		</script>

      <!-- ========== 書籍履歴テーブル ========== -->
      <div class="row d-flex justify-content-center mb-4">
        <h6 class="col-8 fw-bold mb-2">書籍履歴</h6>
        <div class="col-8 table-responsive">
          <table class="table table-striped table-sm">
            <thead class="table-primary">
              <tr>
                <th scope="col" class="text-center border-end border-2 border-white">日付</th>
                <th scope="col" class="text-center border-end border-2 border-white">ユーザー</th>
                <th scope="col" class="text-center border-end border-2 border-white">貸出履歴</th>
              </tr>
            </thead>
            <tbody>
              <!-- 履歴データの表示 -->
                <!----------------------------ここに履歴データの表示を追加してください------------------------>
              <!-- 履歴がない場合 -->
              <tr class="text-center return">
<!--                <td colspan="3" class="text-center text-muted">履歴がありません</td>-->
				<td th:text="${bookHistory.returnDate}" class="text-white" style="background-color: #15B2EE;">5月29日</td>
				<td th:text="${bookHistory.userName}" class="text-white" style="background-color: #15B2EE;">木俣</td>
				<td class="text-white" style="background-color: #15B2EE;">返却</td>
              </tr>
			  
			  <tr class="comment">
				<td colspan="3" style="background-color: #15B2EE;">
					<p class="col-8 text-white mb-0">感想・コメント</p>
					<p th:text="${bookHistory.review}" class="p-1" style="background-color: #E8ECE8; height: 50px; border-radius: 10px;"></p>
				</td>
			  </tr>
			  
			  <tr class="text-center lending">
  <!--                <td colspan="3" class="text-center text-muted">履歴がありません</td>-->
  				<td th:text="${bookHistory.lendingDate}" style="background-color: #99B9C5; color: #fff;">5月20日</td>
  				<td th:text="${bookHistory.userName}" style="background-color: #99B9C5; color: #fff;">木俣</td>
  				<td style="background-color: #99B9C5; color: #fff;">貸出</td>
              </tr>
            </tbody>
          </table>
	  		<style>
				.comment {
				    overflow: hidden;           /* はみ出しを隠す */
				    opacity: 0;                 /* 透明 */
				    transform: translateY(-10px); /* 上にずらしておく */
				    transition: all 0.6s ease;  /* アニメーション */
					pointer-events: none;
					border: 1px white;
				}
				
				.return:hover + .comment,
				.comment:hover {
				    max-height: 200px;          /* アニメーションで高さを展開 */
				    opacity: 1;                 /* フェードイン */
				    transform: translateY(0);   /* 元の位置に移動 */
					pointer-events: auto;
				}
				
				.lending {
					transform: translateY(-99px);
					transition: all 0.6s ease;  /* アニメーション */
					border: 1px white;
				}
				
				.return:hover ~ .lending,
				.comment:hover ~ .lending {
					transform: translateY(0);
				}
			</style>
        </div>
      </div>


    </div>

  </section>



  <!-- 画像エラー処理用JavaScript -->
  <script>
    function handleImageError(img) {
      // 無限ループを防ぐため、既にエラー処理済みの場合は何もしない
      if (img.dataset.errorHandled === 'true') {
        return;
      }
      
      // エラー処理済みフラグを設定
      img.dataset.errorHandled = 'true';
      
      // 画像の代わりにBootstrapアイコンを表示するため、親要素を変更
      const parent = img.parentElement;
      parent.innerHTML = `
        <div class="d-flex align-items-center justify-content-center py-5 text-muted">
          <i class="bi bi-book display-2"></i>
        </div>
      `;
    }
  </script>
</body>
</html>
