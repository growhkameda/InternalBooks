<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/layout :: layout(~{::title}, ~{::section})}">

<head>
  <title>書籍削除画面</title>
</head>

<body>
  <section th:fragment="section">

    <style>
      .fixed-page-width {
        max-width: 600px;
        margin: 0 auto;
        padding: 0 20px;
      }

      .pagination-buttons {
        display: flex;
        justify-content: space-between;
        margin-bottom: 10px;
      }

      .pagination-buttons .btn {
        font-size: 16px;
      }
    </style>

    <div class="container text-center fixed-page-width" style="margin-bottom: 60px; font-size: 30px; font-weight: 600;">
      書籍削除
    </div>

    <div class="container text-center fixed-page-width" style="margin-bottom: 60px; font-size: 30px;">
      カテゴリー：<span th:text="${category}">カテゴリー名</span>
    </div>

    <!-- ========== 書籍削除成功/失敗メッセージ表示 ========== -->
    <div th:if="${message != null}"
      class="container fixed-page-width h-25 border bg-body-secondary d-flex align-items-center justify-content-center"
      style="margin-bottom: 20px;">
      <p class="mt-1 ms-3 mb-2 fw-normal h6" th:text="${message}"></p>
    </div>

    <div class="container fixed-page-width">
      <div class="row">
        <a th:href="@{/admin/bookdeletingcategories}" class="col-auto btn"
          style="margin-bottom: 10px; font-size: 16px; text-align: left;">
          カテゴリー選択へ戻る↵
        </a>
      </div>
    </div>

    <div class="container fixed-page-width">
      <div id="image-gallery" class="row" style="justify-content: flex-start; margin-bottom: 40px;">
        <!--コントローラーからbookIdListを受け取り、bookIdに格納
        「page」内の「bookdeletingconfirmation.html」に飛ぶボタン
        飛ぶ際に、クリックした本のbookIdを渡す-->
        <a th:each="bookId : ${bookIdList}" th:href="@{'/admin/bookdeletingconfirmation?bookId=' + ${bookId}}"
          class="col-md-4 mb-4 btn" style="text-decoration: none;">
          <img th:src="@{'/images/' + ${bookId} + '.png'}" alt="Book Image" class="img-fluid fixed-size-img" />
        </a>
      </div>

      <div th:if="${#lists.isEmpty(bookIdList)}">
        <p>該当する本が見つかりませんでした。</p>
      </div>

      <div class="pagination-buttons fixed-page-width">

        <!--左側に「← 前のページ」ボタンを表示-->
        <!--左側に表示するように指定-->
        <div class="text-start">
          <div th:if="${currentPage > 0}">
            <a th:href="@{/admin/bookdeleting(category=${category}, page=${currentPage - 1})}"
              class="btn btn-outline-primary">
              ← 前のページ
            </a>
          </div>
        </div>

        <!--右側に「次のページ →」ボタンを表示-->
        <div th:if="${currentPage + 1 < totalPages}">
          <!--右側に表示するように指定-->
          <div class="text-end">
            <a th:href="@{/admin/bookdeleting(category=${category}, page=${currentPage + 1})}"
              class="btn btn-outline-primary">
              次のページ →
            </a>
          </div>
        </div>

      </div>


    </div>
  </section>
</body>

</html>
