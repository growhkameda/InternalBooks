<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/layout :: layout(~{::title}, ~{::section})}">

<head>
    <title>newpage</title>
</head>

<body>
    <section class="vh-100 d-flex justify-content-center align-items-center">
        <div class="container d-flex justify-content-center align-items-center vh-100">
            <div class="w-100" style="max-width: 330px;">

                <!-- タイトル -->
                <h1 class="mb-4 text-center">newpage</h1>

                <!-- 説明文 -->
                <p class="text-center">TOPページから遷移してきました。</p>

                <!-- フォーム -->
                <form style="margin-bottom: 20px;">
                    <div class="Fsinformation">
                        <label class="form-label">質問したいことはありますか？</label><br>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="hitumon" id="hitumonYes" value="yes" checked>
                            <label class="form-check-label" for="hitumonYes">はい</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="hitumon" id="hitumonNo" value="no">
                            <label class="form-check-label" for="hitumonNo">いいえ</label>
                        </div>
                    </div>

                    <div class="Fsinformation">
                        <label for="subject" class="form-label">件名</label>
                        <input type="text" name="subject" id="subject" class="form-control" placeholder="タイトル">
                    </div>

                    <div class="Fsinformation">
                        <label for="message" class="form-label">内容</label>
                        <textarea name="message" id="message" rows="4" class="form-control"
                                  placeholder="お問い合わせ内容を入力してください"></textarea>
                    </div>
                </form>

                <!-- TOPに戻るボタン（フォームの下・左右に配置） -->
                <div class="d-flex justify-content-between" style="margin-top: 10px;">
                    <a class="btn btn-success btn-lg" th:href="@{/page/top}">TOPに戻る</a>
                    <a class="btn btn-success btn-lg" th:href="@{#}">送信</a>
                </div>

            </div>
        </div>
    </section>
</body>

</html>
