<!DOCTYPE html>
<!--
社内図書館システム - QRコードスキャナーページ
-->
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/layout :: layout(~{::title}, ~{::section})}">

<head>
    <title>QRコードスキャナー</title>
</head>

<body>
    <section class="min-vh-100 d-flex justify-content-center align-items-center py-4">

        <div class="container d-flex justify-content-center">
            <div class="w-100" style="max-width: 400px;">

                <!-- タイトル -->
                <h1 class="mb-2 text-center fw-bold">QRコードスキャナー</h1>
                <p class="text-muted small text-center mb-4">カメラでQRコードを読み取ります</p>

                <!-- カメラ映像表示エリア -->
                <div id="video-container"
                    class="position-relative mx-auto rounded-3 bg-light overflow-hidden mb-4 border border-1 border-dark"
                    style="height: 250px; box-shadow: 0 2px 8px rgba(0, 0, 0, .1);">

                    <!-- ビデオ要素（カメラ映像表示、初期状態は非表示） -->
                    <video id="qr-video" class="position-absolute top-0 start-0 w-100 h-100"
                        style="display: none; object-fit: cover; background-color: black; z-index: 1;"
                        playsinline muted autoplay>
                    </video>

                    <!-- スキャンガイド表示（ビデオが非表示の時に表示） -->
                    <div id="scan-guide"
                        class="position-absolute top-0 start-0 w-100 h-100 d-flex flex-column justify-content-center align-items-center bg-light">
                        <i class="bi bi-camera-video text-muted display-4"></i>
                        <p class="text-muted mt-3 mb-0 text-center small">
                            「スキャン開始」ボタンを押して<br>
                            QRコードをカメラに向けてください
                        </p>
                    </div>

                    <!-- スキャンオーバーレイ（QRコード検出エリアの表示） -->
                    <div id="scan-overlay" class="position-absolute top-50 start-50 translate-middle"
                        style="display: none; z-index: 2;">
                        <div class="border border-warning border-3 bg-transparent"
                            style="width: 160px; height: 160px; border-style: dashed !important;">
                        </div>
                    </div>
                </div>

                <!-- キャンバス要素（QRコード解析用、非表示） -->
                <canvas id="qr-canvas" style="display: none;"></canvas>

                <!-- エラー表示エリア（初期状態は非表示） -->
                <div id="error-message" class="rounded-3 p-3 mb-3"
                    style="display: none; background-color: #fff8e1; border: 1px solid #ffc107;">
                    <div class="d-flex align-items-center gap-3">
                        <i class="bi bi-exclamation-triangle-fill fs-4" style="color: #e6a817;"></i>
                        <div class="flex-grow-1">
                            <h6 class="mb-1 fw-bold">エラーが発生しました</h6>
                            <div id="error-text"></div>
                        </div>
                    </div>
                </div>

                <!-- 操作ボタンセクション -->
                <div class="d-flex flex-column gap-3 mb-4">
                    <button id="start-scan-btn" type="button"
                        class="btn w-100 shadow py-3 fw-bold"
                        style="background-color: white; color: #3CB371; border: 2px solid #3CB371;"
                        onclick="startScanning();">
                        <i class="bi bi-camera me-2"></i>スキャン開始
                    </button>
                    <button id="stop-scan-btn" type="button"
                        class="btn w-100 py-3 fw-bold"
                        style="background-color: #f5f5f5; color: #aaaaaa; border: 2px solid #cccccc; box-shadow: none; cursor: not-allowed;"
                        disabled onclick="stopScanning();">
                        <i class="bi bi-stop-circle me-2"></i>スキャン停止
                    </button>
                </div>

                <!-- TOPへ戻るボタン -->
                <div class="d-flex justify-content-start">
                    <a href="/page/top">
                        <img src="/images/TOP_Return.png" style="width: 40px; height: 40px;">
                    </a>
                </div>

            </div>
        </div>

        <!-- jsQRライブラリ（QRコード解析用） -->
        <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>

        <!-- メインのJavaScript処理 -->
        <script>
            // グローバル変数
            let video, canvas, context, scanning = false, stream = null;

            // DOM読み込み完了後の初期化
            document.addEventListener('DOMContentLoaded', function () {
                // 1秒後に初期化を実行（要素の確実な読み込みを待つ）
                setTimeout(function () {
                    // 要素の初期化
                    initializeElements();

                    // イベントリスナーの設定
                    setupEventListeners();

                    // カメラ対応チェック
                    checkCameraSupport();
                }, 1000);
            });

            function initializeElements() {
                video = document.getElementById('qr-video');
                canvas = document.getElementById('qr-canvas');

                if (canvas) {
                    context = canvas.getContext('2d');
                }
            }

            function setupEventListeners() {
                const startBtn = document.getElementById('start-scan-btn');
                const stopBtn = document.getElementById('stop-scan-btn');

                if (startBtn) {
                    startBtn.addEventListener('click', function () {
                        startScanning();
                    });
                }

                if (stopBtn) {
                    stopBtn.addEventListener('click', function () {
                        stopScanning();
                    });
                }

            }

            function checkCameraSupport() {
                if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                    showError('このブラウザはカメラ機能をサポートしていません');
                    return false;
                }

                if (typeof jsQR === 'undefined') {
                    showError('jsQRライブラリが読み込まれていません');
                    return false;
                }

                return true;

            }

            async function startScanning() {
                try {
                    if (scanning) {
                        return;
                    }

                    hideError();

                    const constraints = {
                        video: {
                            facingMode: { ideal: 'environment' },
                            width: { ideal: 640, max: 1280 },
                            height: { ideal: 480, max: 720 }
                        }
                    };

                    stream = await navigator.mediaDevices.getUserMedia(constraints);

                    video.srcObject = stream;

                    // ガイドを非表示にしてビデオを表示
                    document.getElementById('scan-guide').style.display = 'none';
                    video.style.display = 'block';

                    await new Promise((resolve) => {
                        video.onloadedmetadata = () => {
                            video.play().then(() => {
                                resolve();
                            }).catch((err) => {
                                console.error('ビデオ再生エラー:', err);
                                resolve(); // エラーでも続行
                            });
                        };

                        // タイムアウト処理
                        setTimeout(() => {
                            resolve();
                        }, 3000);
                    });

                    // stopScanning が await 中に呼ばれた場合、stream は null になっている
                    if (!stream) return;

                    // オーバーレイを表示
                    document.getElementById('scan-overlay').style.display = 'block';

                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;

                    scanning = true;
                    updateButtonStates(true);

                    requestAnimationFrame(scanLoop);

                } catch (error) {
                    console.error('カメラ開始エラー:', error);

                    let errorMessage = 'カメラの開始に失敗しました';

                    if (error.name === 'NotAllowedError') {
                        errorMessage = 'カメラの使用が許可されていません。ブラウザの設定を確認してください';
                    } else if (error.name === 'NotFoundError') {
                        errorMessage = 'カメラが見つかりません';
                    } else if (error.name === 'NotReadableError') {
                        errorMessage = 'カメラが他のアプリケーションで使用中です';
                    }

                    showError(errorMessage);
                }
            }

            function stopScanning() {
                scanning = false;

                if (stream) {
                    stream.getTracks().forEach(track => track.stop());
                    stream = null;
                }

                if (video) {
                    video.srcObject = null;
                    video.style.display = 'none';
                }

                // 表示を元に戻す：ガイドを表示、オーバーレイを非表示
                document.getElementById('scan-guide').style.display = 'flex';
                document.getElementById('scan-overlay').style.display = 'none';

                updateButtonStates(false);
                hideError();
            }

            function scanLoop() {
                if (!scanning) {
                    return;
                }

                if (video.readyState === video.HAVE_ENOUGH_DATA) {
                    context.drawImage(video, 0, 0, canvas.width, canvas.height);

                    const imageData = context.getImageData(0, 0, canvas.width, canvas.height);
                    const qrCode = jsQR(imageData.data, imageData.width, imageData.height);

                    if (qrCode) {
                        // QRコード読み取り成功時の処理
                        stopScanning();

                        // フォーム送信によるsearchresultページへの遷移
                        // セッション維持を確実にするためwindow.location.hrefではなくフォーム送信を使用
                        const form = document.createElement('form');
                        form.method = 'GET';
                        form.action = '/page/searchresult';

                        // QRデータをhiddenパラメータとして設定
                        const input = document.createElement('input');
                        input.type = 'hidden';
                        input.name = 'qrData';
                        input.value = qrCode.data;
                        form.appendChild(input);

                        // フォームを送信してページ遷移
                        document.body.appendChild(form);
                        form.submit();

                        return;
                    }
                }

                requestAnimationFrame(scanLoop);
            }

            function updateButtonStates(isScanning) {
                const startBtn = document.getElementById('start-scan-btn');
                const stopBtn = document.getElementById('stop-scan-btn');

                if (startBtn) {
                    startBtn.disabled = isScanning;
                    if (isScanning) {
                        startBtn.innerHTML = '<i class="bi bi-camera me-2"></i>スキャン中...';
                        // スキャン中：開始ボタンをグレー（disabled）スタイルに
                        startBtn.style.backgroundColor = '#f5f5f5';
                        startBtn.style.color = '#aaaaaa';
                        startBtn.style.border = '2px solid #cccccc';
                        startBtn.style.boxShadow = 'none';
                        startBtn.style.cursor = 'not-allowed';
                        startBtn.classList.remove('shadow');
                    } else {
                        startBtn.innerHTML = '<i class="bi bi-camera me-2"></i>スキャン開始';
                        // 待機中：開始ボタンを緑（有効）スタイルに
                        startBtn.style.backgroundColor = 'white';
                        startBtn.style.color = '#3CB371';
                        startBtn.style.border = '2px solid #3CB371';
                        startBtn.style.boxShadow = '';
                        startBtn.style.cursor = 'pointer';
                        startBtn.classList.add('shadow');
                    }
                }

                if (stopBtn) {
                    stopBtn.disabled = !isScanning;
                    if (isScanning) {
                        // スキャン中：停止ボタンを緑（有効）スタイルに切り替え
                        stopBtn.style.backgroundColor = 'white';
                        stopBtn.style.color = '#3CB371';
                        stopBtn.style.border = '2px solid #3CB371';
                        stopBtn.style.boxShadow = '';
                        stopBtn.style.cursor = 'pointer';
                        stopBtn.classList.add('shadow');
                    } else {
                        // 待機中：停止ボタンをグレー（disabled）スタイルに切り替え
                        stopBtn.style.backgroundColor = '#f5f5f5';
                        stopBtn.style.color = '#aaaaaa';
                        stopBtn.style.border = '2px solid #cccccc';
                        stopBtn.style.boxShadow = 'none';
                        stopBtn.style.cursor = 'not-allowed';
                        stopBtn.classList.remove('shadow');
                    }
                }
            }

            function showError(message) {
                const errorDiv = document.getElementById('error-message');
                const errorText = document.getElementById('error-text');

                if (errorDiv && errorText) {
                    errorText.textContent = message;
                    errorDiv.style.display = 'block';
                }
            }

            function hideError() {
                const errorDiv = document.getElementById('error-message');
                if (errorDiv) {
                    errorDiv.style.display = 'none';
                }
            }

            // ページを離れる際のクリーンアップ
            window.addEventListener('beforeunload', function () {
                stopScanning();
            });

            // ページが非表示になった際の処理
            document.addEventListener('visibilitychange', function () {
                if (document.hidden && scanning) {
                    stopScanning();
                }
            });

            // 関数をグローバルスコープで定義（onclickから呼び出せるように）
            window.startScanning = startScanning;
            window.stopScanning = stopScanning;
        </script>
    </section>
</body>

</html>
