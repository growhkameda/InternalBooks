<!DOCTYPE html>
<!--
社内図書館システム - QRコードスキャナーページ
-->
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/layout :: layout(~{::title}, ~{::section})}">

<head>
    <title>QRコードスキャナー</title>
</head>

<body>
    <section class="min-vh-100 d-flex justify-content-center align-items-center py-4">

        <div class="container d-flex justify-content-center">
            <div class="w-100" style="max-width: 400px;">

                <!-- タイトル -->
                <h1 class="mb-2 text-center fw-bold">QRコードを読み取る</h1>
                <p class="text-muted small text-center mb-4">QRコードを黄色の枠に写してください</p>

                <!-- カメラ映像表示エリア -->
                <div id="video-container"
                    class="position-relative mx-auto rounded-3 bg-light overflow-hidden mb-4 border border-1 border-dark"
                    style="height: 250px; box-shadow: 0 2px 8px rgba(0, 0, 0, .1);">

                    <!-- ビデオ要素（カメラ映像表示、初期状態は非表示） -->
                    <video id="qr-video" class="position-absolute top-0 start-0 w-100 h-100"
                        style="display: none; object-fit: cover; background-color: black; z-index: 1;"
                        playsinline muted autoplay>
                    </video>

                    <!-- スキャンガイド表示（ビデオが非表示の時に表示） -->
                    <div id="scan-guide"
                        class="position-absolute top-0 start-0 w-100 h-100 d-flex flex-column justify-content-center align-items-center bg-light">
                        <i class="bi bi-camera-video text-muted display-4"></i>
                        <p class="text-muted mt-3 mb-0 text-center small">
                            「スキャン開始」ボタンを押して<br>
                            QRコードをカメラに向けてください
                        </p>
                    </div>

                    <!-- スキャンオーバーレイ（QRコード検出エリアの表示） -->
                    <div id="scan-overlay" class="position-absolute top-50 start-50 translate-middle"
                        style="display: none; z-index: 2;">
                        <div class="border border-warning border-3 bg-transparent"
                            style="width: 160px; height: 160px; border-style: dashed !important;">
                        </div>
                    </div>

                    <!-- スキャン状態表示（準備中/スキャン中/ヒント） -->
                    <div id="scan-status-overlay"
                        class="position-absolute top-0 start-0 w-100 d-flex justify-content-center pt-2"
                        style="display: none; z-index: 3; pointer-events: none;">
                        <span id="scan-status-text"
                            class="badge bg-dark bg-opacity-75 px-3 py-2"
                            style="font-size: 0.85rem;"
                            aria-live="polite">
                            カメラ準備中…
                        </span>
                    </div>
                </div>

                <!-- キャンバス要素（QRコード解析用、非表示） -->
                <canvas id="qr-canvas" style="display: none;"></canvas>

                <!-- エラー表示エリア（フラッシュメッセージ受信時は初期表示、JS制御時はstyle切替） -->
                <div id="error-message" class="rounded-3 p-3 mb-3"
                    th:style="${errorMessage} != null ? 'display: block; background-color: #fff8e1; border: 1px solid #ffc107;' : 'display: none; background-color: #fff8e1; border: 1px solid #ffc107;'"
                    role="alert" aria-live="assertive">
                    <div class="d-flex align-items-center gap-3">
                        <i class="bi bi-exclamation-triangle-fill fs-4" style="color: #e6a817;"></i>
                        <div class="flex-grow-1">
                            <h6 class="mb-1 fw-bold">エラーが発生しました</h6>
                            <div id="error-text" th:text="${errorMessage}"></div>
                        </div>
                    </div>
                </div>

                <!-- 操作ボタンセクション -->
                <div class="d-flex flex-column gap-3 mb-4">
                    <button id="start-scan-btn" type="button"
                        class="btn w-100 shadow py-3 fw-bold"
                        style="background-color: white; color: #3CB371; border: 2px solid #3CB371;">
                        <i class="bi bi-camera me-2"></i>スキャン開始
                    </button>
                    <button id="stop-scan-btn" type="button"
                        class="btn w-100 py-3 fw-bold"
                        style="background-color: #f5f5f5; color: #aaaaaa; border: 2px solid #cccccc; box-shadow: none; cursor: not-allowed;"
                        disabled>
                        <i class="bi bi-stop-circle me-2"></i>スキャン停止
                    </button>
                </div>

                <!-- TOPへ戻るボタン -->
                <div class="d-flex justify-content-start">
                    <a href="/page/top">
                        <img src="/images/TOP_Return.png" style="width: 40px; height: 40px;">
                    </a>
                </div>

            </div>
        </div>

        <!-- jsQRライブラリ（QRコード解析用） -->
        <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>

        <!-- メインのJavaScript処理 -->
        <script>
            // グローバル変数
            let video, canvas, context, scanning = false, stream = null;
            let scanStartTime = 0;
            let hintShown = false;
            // 検出失敗が続いた場合に追加ヒントを出すしきい値
            const HINT_THRESHOLD_MS = 3000;
            // 露出・AF安定のための起動ウォームアップ
            const WARMUP_MS = 300;
            // 最初の実描画フレーム待機の最大時間
            const FRAME_WAIT_TIMEOUT_MS = 5000;

            // DOM読み込み完了後の初期化（不要な1秒待機を廃止）
            document.addEventListener('DOMContentLoaded', function () {
                initializeElements();
                setupEventListeners();
                checkCameraSupport();
            });

            function initializeElements() {
                video = document.getElementById('qr-video');
                canvas = document.getElementById('qr-canvas');

                if (canvas) {
                    // getImageData を毎フレーム呼ぶため willReadFrequently を明示
                    context = canvas.getContext('2d', { willReadFrequently: true });
                }
            }

            function setupEventListeners() {
                const startBtn = document.getElementById('start-scan-btn');
                const stopBtn = document.getElementById('stop-scan-btn');

                if (startBtn) {
                    startBtn.addEventListener('click', startScanning);
                }
                if (stopBtn) {
                    stopBtn.addEventListener('click', stopScanning);
                }
            }

            function checkCameraSupport() {
                if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                    showError('このブラウザはカメラ機能をサポートしていません');
                    return false;
                }

                if (typeof jsQR === 'undefined') {
                    showError('jsQRライブラリが読み込まれていません');
                    return false;
                }

                return true;
            }

            /**
             * 最初の実描画フレーム到達を待つ。
             * requestVideoFrameCallback が使える環境ではそれを優先、
             * 非対応環境では playing イベント + videoWidth ポーリングでフォールバックする。
             */
            function waitForFirstFrame(videoEl, timeoutMs) {
                return new Promise((resolve, reject) => {
                    let settled = false;
                    const finish = (ok, reason) => {
                        if (settled) return;
                        settled = true;
                        ok ? resolve() : reject(new Error(reason || 'unknown'));
                    };

                    const pollForDimensions = () => {
                        const start = performance.now();
                        const tick = () => {
                            if (settled) return;
                            if (videoEl.videoWidth > 0 && videoEl.videoHeight > 0) {
                                finish(true);
                                return;
                            }
                            if (performance.now() - start > timeoutMs) {
                                finish(false, 'dimension polling timeout');
                                return;
                            }
                            requestAnimationFrame(tick);
                        };
                        tick();
                    };

                    if (typeof videoEl.requestVideoFrameCallback === 'function') {
                        videoEl.requestVideoFrameCallback(() => {
                            if (videoEl.videoWidth > 0 && videoEl.videoHeight > 0) {
                                finish(true);
                            } else {
                                pollForDimensions();
                            }
                        });
                    } else {
                        videoEl.addEventListener('playing', pollForDimensions, { once: true });
                        if (!videoEl.paused) {
                            pollForDimensions();
                        }
                    }

                    setTimeout(() => finish(false, 'overall timeout'), timeoutMs);
                });
            }

            async function startScanning() {
                try {
                    if (scanning) {
                        return;
                    }

                    hideError();
                    setStatusText('カメラ準備中…');

                    const constraints = {
                        video: {
                            facingMode: { ideal: 'environment' },
                            width: { ideal: 640, max: 1280 },
                            height: { ideal: 480, max: 720 }
                        }
                    };

                    stream = await navigator.mediaDevices.getUserMedia(constraints);
                    video.srcObject = stream;

                    document.getElementById('scan-guide').style.display = 'none';
                    video.style.display = 'block';
                    showStatusOverlay(true);

                    try {
                        await video.play();
                    } catch (playErr) {
                        console.error('ビデオ再生エラー:', playErr);
                    }

                    try {
                        await waitForFirstFrame(video, FRAME_WAIT_TIMEOUT_MS);
                    } catch (frameErr) {
                        console.warn('フレーム到達タイムアウト:', frameErr);
                        stopScanning();
                        showError('カメラの起動に失敗しました。ページを再読み込みするか、しばらく経ってから再度お試しください。');
                        return;
                    }

                    // stopScanning が await 中に呼ばれた場合
                    if (!stream) return;

                    // 露出・AF安定のための短いウォームアップ
                    await new Promise(r => setTimeout(r, WARMUP_MS));
                    if (!stream) return;

                    document.getElementById('scan-overlay').style.display = 'block';

                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;

                    scanning = true;
                    scanStartTime = performance.now();
                    hintShown = false;
                    setStatusText('QRコードを枠内に合わせてください');
                    updateButtonStates(true);

                    requestAnimationFrame(scanLoop);

                } catch (error) {
                    console.error('カメラ開始エラー:', error);

                    let errorMessage = 'カメラの開始に失敗しました';

                    if (error.name === 'NotAllowedError') {
                        errorMessage = 'カメラの使用が許可されていません。ブラウザの設定を確認してください';
                    } else if (error.name === 'NotFoundError') {
                        errorMessage = 'カメラが見つかりません';
                    } else if (error.name === 'NotReadableError') {
                        errorMessage = 'カメラが他のアプリケーションで使用中です';
                    }

                    showError(errorMessage);
                    stopScanning();
                }
            }

            function stopScanning() {
                scanning = false;

                if (stream) {
                    stream.getTracks().forEach(track => track.stop());
                    stream = null;
                }

                if (video) {
                    video.srcObject = null;
                    video.style.display = 'none';
                }

                document.getElementById('scan-guide').style.display = 'flex';
                document.getElementById('scan-overlay').style.display = 'none';
                showStatusOverlay(false);

                updateButtonStates(false);
                hideError();
            }

            function scanLoop() {
                if (!scanning) {
                    return;
                }

                if (video.readyState === video.HAVE_ENOUGH_DATA &&
                    video.videoWidth > 0 && video.videoHeight > 0) {

                    context.drawImage(video, 0, 0, canvas.width, canvas.height);

                    const imageData = context.getImageData(0, 0, canvas.width, canvas.height);
                    // 社内QRの反転有無が未確認のため inversionAttempts はデフォルト維持
                    const qrCode = jsQR(imageData.data, imageData.width, imageData.height);

                    if (qrCode) {
                        // QRコード読み取り成功時の処理
                        stopScanning();

                        // フォーム送信によるsearchresultページへの遷移
                        // セッション維持を確実にするためwindow.location.hrefではなくフォーム送信を使用
                        const form = document.createElement('form');
                        form.method = 'GET';
                        form.action = '/page/searchresult';

                        const input = document.createElement('input');
                        input.type = 'hidden';
                        input.name = 'qrData';
                        input.value = qrCode.data;
                        form.appendChild(input);

                        document.body.appendChild(form);
                        form.submit();

                        return;
                    }

                    // 一定時間検出できなければ補助ヒントを切り替え
                    if (!hintShown && performance.now() - scanStartTime > HINT_THRESHOLD_MS) {
                        hintShown = true;
                        setStatusText('明るい場所で、ゆっくり近づけてください');
                    }
                }

                requestAnimationFrame(scanLoop);
            }

            // スキャン状態オーバーレイの表示/非表示
            function showStatusOverlay(visible) {
                const overlay = document.getElementById('scan-status-overlay');
                if (overlay) {
                    overlay.style.display = visible ? 'flex' : 'none';
                }
            }

            // スキャン状態テキストの更新
            function setStatusText(text) {
                const el = document.getElementById('scan-status-text');
                if (el) {
                    el.textContent = text;
                }
            }

            function updateButtonStates(isScanning) {
                const startBtn = document.getElementById('start-scan-btn');
                const stopBtn = document.getElementById('stop-scan-btn');

                if (startBtn) {
                    startBtn.disabled = isScanning;
                    if (isScanning) {
                        startBtn.innerHTML = '<i class="bi bi-camera me-2"></i>スキャン中...';
                        // スキャン中：開始ボタンをグレー（disabled）スタイルに
                        startBtn.style.backgroundColor = '#f5f5f5';
                        startBtn.style.color = '#aaaaaa';
                        startBtn.style.border = '2px solid #cccccc';
                        startBtn.style.boxShadow = 'none';
                        startBtn.style.cursor = 'not-allowed';
                        startBtn.classList.remove('shadow');
                    } else {
                        startBtn.innerHTML = '<i class="bi bi-camera me-2"></i>スキャン開始';
                        // 待機中：開始ボタンを緑（有効）スタイルに
                        startBtn.style.backgroundColor = 'white';
                        startBtn.style.color = '#3CB371';
                        startBtn.style.border = '2px solid #3CB371';
                        startBtn.style.boxShadow = '';
                        startBtn.style.cursor = 'pointer';
                        startBtn.classList.add('shadow');
                    }
                }

                if (stopBtn) {
                    stopBtn.disabled = !isScanning;
                    if (isScanning) {
                        // スキャン中：停止ボタンを緑（有効）スタイルに切り替え
                        stopBtn.style.backgroundColor = 'white';
                        stopBtn.style.color = '#3CB371';
                        stopBtn.style.border = '2px solid #3CB371';
                        stopBtn.style.boxShadow = '';
                        stopBtn.style.cursor = 'pointer';
                        stopBtn.classList.add('shadow');
                    } else {
                        // 待機中：停止ボタンをグレー（disabled）スタイルに切り替え
                        stopBtn.style.backgroundColor = '#f5f5f5';
                        stopBtn.style.color = '#aaaaaa';
                        stopBtn.style.border = '2px solid #cccccc';
                        stopBtn.style.boxShadow = 'none';
                        stopBtn.style.cursor = 'not-allowed';
                        stopBtn.classList.remove('shadow');
                    }
                }
            }

            function showError(message) {
                const errorDiv = document.getElementById('error-message');
                const errorText = document.getElementById('error-text');

                if (errorDiv && errorText) {
                    errorText.textContent = message;
                    errorDiv.style.display = 'block';
                }
            }

            function hideError() {
                const errorDiv = document.getElementById('error-message');
                if (errorDiv) {
                    errorDiv.style.display = 'none';
                }
            }

            // ページを離れる際のクリーンアップ
            window.addEventListener('beforeunload', function () {
                stopScanning();
            });

            // ページが非表示になった際の処理
            document.addEventListener('visibilitychange', function () {
                if (document.hidden && scanning) {
                    stopScanning();
                }
            });
        </script>
    </section>
</body>

</html>
