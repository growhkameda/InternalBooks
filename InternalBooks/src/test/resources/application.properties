spring.application.name=InternalBooks
spring.datasource.url=jdbc:mysql://localhost:13306/internalbooks
spring.datasource.username=admin
spring.datasource.password=password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA設定 (テスト時はスキーマを自動生成・更新する)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# サーバー設定（外部アクセス許可）
server.port=8080
server.address=0.0.0.0

# セッション設定
server.servlet.session.cookie.http-only=true
server.servlet.session.timeout=30m

# ========== 画像ストレージ設定 START ==========
# 画像ストレージタイプ: local または s3
app.image.storage.type=local
# ローカル環境用の画像ディレクトリパス
app.image.storage.local.directory=src/test/resources/static/images/
# ========== 画像ストレージ設定 END ==========
